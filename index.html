<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased selection:bg-brand-500 selection:text-white">

  <div id="root" class="flex flex-col min-h-screen"></div>

  <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.0/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useDeferredValue } = React;

    const Icon = React.memo(({ name, className, ...props }) => {
      const iconMap = {
        'tv': 'tv',
        'menu': 'menu',
        'x': 'close',
        'star': 'star',
        'trophy': 'emoji_events',
        'globe': 'public',
        'grid': 'grid_view',
        'server': 'dns',
        'info': 'info',
        'radio': 'radio',
        'volume-x': 'volume_off',
        'volume-1': 'volume_down',
        'volume-2': 'volume_up',
        'copy': 'content_copy',
        'check': 'check',
        'alert-octagon': 'warning',
        'loader-2': 'autorenew',
        'chevron-left': 'chevron_left',
        'chevron-right': 'chevron_right',
        'chevron-down': 'expand_more',
        'arrow-right': 'arrow_forward',
        'monitor-play': 'ondemand_video',
        'play-square': 'smart_display',
        'home': 'home',
        'settings': 'settings',
        'newspaper': 'newspaper',
        'music': 'music_note',
        'film': 'movie',
        'smile': 'sentiment_satisfied',
        'car': 'directions_car',
        'briefcase': 'work',
        'laugh': 'sentiment_very_satisfied',
        'graduation-cap': 'school',
        'heart': 'favorite',
        'compass': 'explore',
        'cloud-sun': 'cloud_queue',
        'sparkles': 'auto_awesome',
        'clapperboard': 'movie_creation',
        'book-open': 'menu_book',
        'search': 'search'
      };

      const materialName = iconMap[name] || name.replace(/-/g, '_');
      
      const isFilled = className && (
        className.includes('fill-amber-400') || 
        className.includes('fill-current') || 
        className.includes('fill-brand-400')
      );

      const style = {
        fontSize: 'inherit',
        width: '1.2em',
        height: '1.2em',
        fontVariationSettings: isFilled ? "'FILL' 1, 'wght' 400" : "'FILL' 0, 'wght' 400"
      };

      return (
        <span 
          className={`material-symbols-outlined select-none flex items-center justify-center shrink-0 ${className || ''}`}
          style={style}
          {...props}
        >
          {materialName}
        </span>
      );
    });

    const CURATED_CHANNELS = [];
    const BANGLADESH_CHANNELS_PRESET = [];

    const isSecure = (url) => url && url.toLowerCase().startsWith('https://');

    const ChannelLogo = React.memo(({ name, logoUrl }) => {
      const [isError, setIsError] = useState(!logoUrl);
      useEffect(() => { setIsError(!logoUrl); }, [logoUrl]);

      if (isError) {
        let hash = 0;
        for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
        const hue = Math.abs(hash % 360);
        const bgStyle = { background: `linear-gradient(135deg, hsl(${hue}, 70%, 40%) 0%, hsl(${(hue + 60) % 360}, 80%, 28%) 100%)` };
        const initials = name.replace(/[^a-zA-Z0-9 ]/g, "").split(" ").filter(Boolean).map(w => w[0]).slice(0, 2).join("").toUpperCase() || name.substring(0, 2).toUpperCase();

        return (
          <div style={bgStyle} className="w-full h-full flex items-center justify-center text-white font-extrabold text-[11px] tracking-wider shadow-inner select-none uppercase">
            {initials}
          </div>
        );
      }
      return <img src={logoUrl} alt="" loading="lazy" className="w-full h-full object-contain p-1" onError={() => setIsError(true)} />;
    });

    const getCategoryIcon = (catId) => {
      const mapping = { sports: "trophy", news: "newspaper", music: "music", movies: "film", kids: "smile", science: "globe", entertainment: "tv", documentary: "book-open", auto: "car", business: "briefcase", comedy: "laugh", education: "graduation-cap", religious: "heart", travel: "compass", weather: "cloud-sun", lifestyle: "sparkles", series: "clapperboard" };
      return mapping[catId] || "tv";
    };

    const ChannelCard = React.memo(({ channel, isFavorited, onToggleFavorite, onSelect, className = "" }) => (
      <div
        onClick={() => onSelect(channel)}
        className={`group flex flex-col p-2 sm:p-2.5 rounded-2xl bg-slate-900 border border-slate-800/80 hover:bg-slate-800 hover:border-brand-500/50 hover:shadow-xl hover:shadow-brand-500/10 transition-all text-left relative overflow-hidden cursor-pointer ${className}`}
      >
        <div 
          className="absolute top-2.5 right-2.5 z-20 cursor-pointer p-1 sm:p-1.5 rounded-lg bg-slate-950/80 backdrop-blur-sm border border-slate-800 opacity-0 group-hover:opacity-100 transition-opacity hover:bg-slate-900"
          onClick={(e) => { e.stopPropagation(); onToggleFavorite(channel.id, e); }}
        >
          <Icon name="star" className={`w-3.5 h-3.5 ${isFavorited ? 'fill-amber-400 text-amber-400' : 'text-slate-400'}`} />
        </div>
        <div className="w-full aspect-video bg-slate-700 rounded-xl mb-2.5 flex items-center justify-center p-2 relative overflow-hidden">
          <div className="w-full h-full relative z-10 drop-shadow-[0_0_8px_rgba(0,0,0.2,0.2)]">
            <ChannelLogo name={channel.name} logoUrl={channel.logo} />
          </div>
          <div className="absolute inset-0 opacity-20 blur-xl scale-150 pointer-events-none">
            <ChannelLogo name={channel.name} logoUrl={channel.logo} />
          </div>
        </div>
        <h4 className="text-[11px] sm:text-xs font-bold text-slate-200 group-hover:text-white truncate w-full px-1">{channel.name}</h4>
        <div className="flex items-center gap-1.5 mt-1.5 px-1 text-[9px] sm:text-[10px] uppercase font-bold tracking-wider text-slate-500">
          <span className="truncate max-w-[100px] bg-slate-950 border border-slate-800 px-1.5 py-0.5 rounded text-brand-400/80">{channel.category}</span>
        </div>
      </div>
    ));

    function ChannelCarousel({ title, icon, channels, onSelectChannel, favorites, toggleFavorite, onSeeAll }) {
      const containerRef = useRef(null);
      const scroll = (direction) => {
        if (containerRef.current) {
          const scrollAmount = direction === 'left' ? -400 : 400;
          containerRef.current.scrollBy({ left: scrollAmount, behavior: 'smooth' });
        }
      };

      if (!channels || channels.length === 0) return null;

      return (
        <div className="flex flex-col gap-3 mt-4 relative">
          <div className="flex items-center justify-between">
            <div className="flex items-center gap-2">
              <span className="text-lg font-bold text-white flex items-center gap-2">
                {icon} {title}
              </span>
              <span className="text-xs bg-slate-850 text-slate-400 px-2.5 py-0.5 rounded-full font-semibold">{channels.length}</span>
            </div>
            
            <div className="flex items-center gap-1.5">
              {onSeeAll && (
                <button onClick={() => onSeeAll({ title, channels })} className="text-[10px] sm:text-xs font-bold text-brand-400 hover:text-white bg-brand-500/10 hover:bg-brand-500/80 px-2.5 py-1 sm:px-3 sm:py-1.5 rounded-lg transition-colors mr-1 flex items-center gap-1">
                  See All <Icon name="arrow-right" className="w-3.5 h-3.5" />
                </button>
              )}
              <button onClick={() => scroll('left')} className="h-7 w-7 sm:h-8 sm:w-8 rounded-lg bg-slate-900 border border-slate-850 hover:bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center transition-colors">
                <Icon name="chevron-left" className="w-3.5 h-3.5 sm:w-4 sm:h-4" />
              </button>
              <button onClick={() => scroll('right')} className="h-7 w-7 sm:h-8 sm:w-8 rounded-lg bg-slate-900 border border-slate-800 hover:bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center transition-colors">
                <Icon name="chevron-right" className="w-3.5 h-3.5 sm:w-4 sm:h-4" />
              </button>
            </div>
          </div>

          <div ref={containerRef} className="flex overflow-x-auto gap-3 sm:gap-4 pb-4 scroll-smooth snap-x snap-mandatory no-scrollbar" style={{ scrollbarWidth: 'none', msOverflowStyle: 'none' }}>
            {channels.map((channel, index) => (
              <ChannelCard 
                key={`${channel.id}-carousel-${index}`} 
                channel={channel} 
                isFavorited={favorites.includes(channel.id)} 
                onToggleFavorite={toggleFavorite} 
                onSelect={onSelectChannel} 
                className="w-[130px] sm:w-[160px] shrink-0 snap-start" 
              />
            ))}
          </div>
        </div>
      );
    }

    function PlayerOverlay({ videoRef, hlsRef, isPlaying, togglePlayPause, triggerFullscreen, isMuted, setIsMuted }) {
      const [currentTime, setCurrentTime] = useState(0);
      const [duration, setDuration] = useState(0);
      const [showControls, setShowControls] = useState(true);
      const [isFullscreen, setIsFullscreen] = useState(false);
      const controlsTimeoutRef = useRef(null);

      useEffect(() => {
        const video = videoRef.current;
        if (!video) return;
        const updateTime = () => setCurrentTime(video.currentTime);
        const updateDuration = () => setDuration(video.duration);
        video.addEventListener('timeupdate', updateTime);
        video.addEventListener('durationchange', updateDuration);
        return () => { video.removeEventListener('timeupdate', updateTime); video.removeEventListener('durationchange', updateDuration); };
      }, [videoRef]);

      useEffect(() => {
        const handleFullscreenChange = () => setIsFullscreen(!!(document.fullscreenElement || document.webkitFullscreenElement));
        document.addEventListener('fullscreenchange', handleFullscreenChange);
        document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
        return () => { document.removeEventListener('fullscreenchange', handleFullscreenChange); document.removeEventListener('webkitfullscreenchange', handleFullscreenChange); };
      }, []);

      useEffect(() => {
        if (showControls && isPlaying) {
          if (controlsTimeoutRef.current) clearTimeout(controlsTimeoutRef.current);
          controlsTimeoutRef.current = setTimeout(() => setShowControls(false), 5000);
        }
        return () => { if (controlsTimeoutRef.current) clearTimeout(controlsTimeoutRef.current); };
      }, [showControls, isPlaying]);

      useEffect(() => {
        const showControlsTemporarily = () => setShowControls(true);
        const toggleControlsOnTap = (e) => { if (e.target.closest('.pointer-events-auto')) return; setShowControls(prev => !prev); };
        const container = videoRef.current?.parentElement;
        if (container) {
          container.addEventListener('mousemove', showControlsTemporarily);
          container.addEventListener('touchstart', showControlsTemporarily, { passive: true });
          container.addEventListener('click', toggleControlsOnTap);
        }
        return () => {
          if (container) { container.removeEventListener('mousemove', showControlsTemporarily); container.removeEventListener('touchstart', showControlsTemporarily); container.removeEventListener('click', toggleControlsOnTap); }
        };
      }, [videoRef]);

      const formatTime = (time) => {
        if (isNaN(time) || !isFinite(time)) return "00:00";
        const h = Math.floor(time / 3600);
        const m = Math.floor((time % 3600) / 60);
        const s = Math.floor(time % 60);
        if (h > 0) return `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      };

      const handleSeek = (e) => {
        const rect = e.currentTarget.getBoundingClientRect();
        const pos = (e.clientX - rect.left) / rect.width;
        if (videoRef.current && duration && isFinite(duration)) videoRef.current.currentTime = pos * duration;
      };

      const handleGoToLive = () => {
        if (hlsRef.current && hlsRef.current.liveSyncPosition) videoRef.current.currentTime = hlsRef.current.liveSyncPosition;
        else if (videoRef.current && isFinite(videoRef.current.duration)) videoRef.current.currentTime = videoRef.current.duration;
      };

      const isLive = !isFinite(duration) || duration === 0 || (videoRef.current && duration - currentTime < 15);

      return (
        <div className={`absolute inset-0 z-20 pointer-events-none flex flex-col justify-end transition-opacity duration-300 ${showControls || !isPlaying ? 'opacity-100' : 'opacity-0'}`}>
          <div className="absolute inset-0 bg-gradient-to-t from-slate-950/90 via-transparent to-transparent opacity-90"></div>
          <div className="relative p-4 md:p-6 w-full flex flex-col gap-3 pointer-events-auto">
            <div className="group/scrubber w-full h-1.5 md:h-2 bg-slate-700/50 rounded-full cursor-pointer relative overflow-visible flex items-center transition-all hover:h-2 md:hover:h-3" onClick={handleSeek}>
              <div className="h-full bg-brand-500 rounded-full relative shadow-[0_0_10px_rgba(139,92,246,0.6)]" style={{ width: `${duration > 0 && isFinite(duration) ? (currentTime / duration) * 100 : 100}%` }}>
                <div className="absolute right-0 top-1/2 -translate-y-1/2 translate-x-1/2 w-3 h-3 md:w-4 md:h-4 bg-white rounded-full scale-0 group-hover/scrubber:scale-100 transition-transform shadow-lg"></div>
              </div>
            </div>
            <div className="flex items-center justify-between text-white mt-1">
              <div className="flex items-center gap-4 md:gap-6">
                <button onClick={togglePlayPause} className="hover:text-brand-400 hover:scale-110 transition-all focus:outline-none drop-shadow-md">
                  {isPlaying ? (
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="4" height="16" x="6" y="4"/><rect width="4" height="16" x="14" y="4"/></svg>
                  ) : (
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                  )}
                </button>
                <button onClick={() => setIsMuted(!isMuted)} className="hover:text-brand-400 hover:scale-110 transition-all focus:outline-none drop-shadow-md">
                  {isMuted ? (
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" x2="15" y1="9" y2="15"/><line x1="15" x2="23" y1="9" y2="15"/></svg>
                  ) : (
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
                  )}
                </button>
                <div className="text-[11px] md:text-sm font-medium tabular-nums text-slate-200 drop-shadow-md flex gap-1 items-center">
                  <span className="text-white">{formatTime(currentTime)}</span>
                  {isFinite(duration) && duration > 0 ? ( <><span className="text-slate-500 font-normal">/</span> <span>{formatTime(duration)}</span></> ) : null}
                </div>
              </div>
              <div className="flex items-center gap-3 md:gap-5">
                <button onClick={handleGoToLive} className={`flex items-center gap-1.5 md:gap-2 text-[10px] md:text-xs font-bold px-2.5 md:px-3 py-1 md:py-1.5 rounded-lg border transition-all shadow-sm ${isLive ? 'bg-red-600/20 text-red-500 border-red-600/30' : 'bg-slate-800/80 text-slate-300 hover:bg-slate-700 hover:text-white border-slate-700 backdrop-blur-sm'}`}>
                  <span className={`w-1.5 h-1.5 md:w-2 md:h-2 rounded-full ${isLive ? 'bg-red-500 animate-pulse' : 'bg-slate-400'}`} /> {isLive ? 'LIVE' : 'GO TO LIVE'}
                </button>
                <button onClick={triggerFullscreen} className="hover:text-brand-400 hover:scale-110 transition-all focus:outline-none drop-shadow-md">
                  {isFullscreen ? (
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/></svg>
                  ) : (
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
                  )}
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [viewState, setViewState] = useState("home"); 
      const [activeMobileTab, setActiveMobileTab] = useState("home"); 
      const [activeCategory, setActiveCategory] = useState("curated");
      const [curatedChannels, setCuratedChannels] = useState(CURATED_CHANNELS);
      const [channels, setChannels] = useState(CURATED_CHANNELS);
      const [curatedSelected, setCuratedSelected] = useState(true);
      
      const [globalChannels, setGlobalChannels] = useState([]);
      const [bdApiChannels, setBdApiChannels] = useState([]); 
      const [isLoadingGlobal, setIsLoadingGlobal] = useState(false);
      
      const [dynamicCountries, setDynamicCountries] = useState([]);
      const [dynamicCategories, setDynamicCategories] = useState([]);

      const [selectedCountryCode, setSelectedCountryCode] = useState("");
      const [searchQuery, setSearchQuery] = useState("");
      const deferredSearchQuery = useDeferredValue(searchQuery); 
      const [selectedCategoryFilter, setSelectedCategoryFilter] = useState("All");
      
      const [favorites, setFavorites] = useState(() => {
        try { const saved = localStorage.getItem("globalstream_favs"); return saved ? JSON.parse(saved) : []; } catch (e) { return []; }
      });
      
      const [showFavoritesOnly, setShowFavoritesOnly] = useState(false);

      const [currentChannel, setCurrentChannel] = useState(() => {
        try { const saved = localStorage.getItem("globalstream_last_channel"); return saved ? JSON.parse(saved) : null; } catch (e) { return null; }
      });

      const [activeServerIndex, setActiveServerIndex] = useState(0);
      const [videoError, setVideoError] = useState(null);
      const [isPlaying, setIsPlaying] = useState(true);
      const [isMuted, setIsMuted] = useState(false);
      const [volumeLevel, setVolumeLevel] = useState(100); 
      const [isCategoryOpen, setIsCategoryOpen] = useState(false);
      const [isCountryOpen, setIsCountryOpen] = useState(false);
      const [isMenuOpen, setIsMenuOpen] = useState(false);
      const [isCopied, setIsCopied] = useState(false);
      const [toastMessage, setToastMessage] = useState(null);

      const [isNsPlayerModalOpen, setIsNsPlayerModalOpen] = useState(false);
      const [seeAllData, setSeeAllData] = useState(null); 
      const [seeAllSearchQuery, setSeeAllSearchQuery] = useState(""); 
      const [copiedLinkId, setCopiedLinkId] = useState(null);
      
      const isManualServerSelectionRef = useRef(false);
      const [visibleLimit, setVisibleLimit] = useState(48);

      const testStreamReachability = async (url) => {
        if (!url) return false;
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 3500); // 3.5s budget
          // Fetch GET with no-cors to capture basic server TCP & SSL handshakes cleanly
          await fetch(url, { method: 'GET', mode: 'no-cors', signal: controller.signal });
          clearTimeout(timeoutId);
          return true;
        } catch (e) {
          return false;
        }
      };

      useEffect(() => {
        const fetchGlobalDatabase = async () => {

            const CUSTOM_M3U_URLS = [

            const parseM3U = (m3uText, sourceName) => {
              const lines = m3uText.split(/\r?\n/);
              const parsedChannels = [];
              const channelMapByTvgId = {};
              let currentCh = null;

              for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line.startsWith('#EXTINF:')) {
                  currentCh = {};
                  const tvgIdMatch = line.match(/tvg-id="([^"]+)"/);
                  const tvgNameMatch = line.match(/tvg-name="([^"]+)"/);
                  const tvgLogoMatch = line.match(/tvg-logo="([^"]+)"/);
                  const groupTitleMatch = line.match(/group-title="([^"]+)"/);
                  const nameMatch = line.split(',');
                  currentCh.tvgId = (tvgIdMatch && tvgIdMatch[1]) ? tvgIdMatch[1] : null;
                  currentCh.name = (tvgNameMatch && tvgNameMatch[1]) ? tvgNameMatch[1] : (nameMatch.length > 1 ? nameMatch[nameMatch.length - 1].trim() : "Unknown Channel");
                  currentCh.logo = (tvgLogoMatch && tvgLogoMatch[1]) ? tvgLogoMatch[1] : "";
                  currentCh.category = (groupTitleMatch && groupTitleMatch[1]) ? groupTitleMatch[1] : "Sports";
                } else if (line && !line.startsWith('#') && currentCh) {

                  if (isSecure(url)) {

                      currentCh.isCustomSource = true;

                  }
                  currentCh = null;

              }
              return parsedChannels;

            const parseBdM3u = (m3uText) => {

            const customM3UPromises = CUSTOM_M3U_URLS.map(source => fetch(source.url).then(res => res.text()).then(text => parseM3U(text, source.name)).catch(err => []));

              fetch('https://iptv-org.github.io/api/streams.json').then(r => r.json()),
              fetch('https://iptv-org.github.io/api/countries.json').then(r => r.json()),
              fetch('https://iptv-org.github.io/api/categories.json').then(r => r.json()),

            const streamsMap = {};

            const bdPresetsMap = {};
            bdPresetsCopy.forEach(p => bdPresetsMap[normalizeName(p.name)] = p);

            const allCustomChannels = customM3UResults.flat();
            const standaloneCustomChannels = [];
            const compiled = [];

            channelsRes.forEach(ch => {
              const channelStreams = streamsMap[ch.id] || [];
              const secureStreams = channelStreams.filter(stream => isSecure(stream.url));
              if (secureStreams.length === 0) return;
              
              const countryInfo = countriesMap[ch.country.toUpperCase()];
              let channelLogo = logosMap[ch.id] || ch.logo || "";
              if (channelLogo && channelLogo.startsWith("http://")) channelLogo = channelLogo.replace("http://", "https://");
              const isBD = ch.country && (ch.country.toUpperCase() === 'BD' || ch.country.toUpperCase() === 'BANGLADESH');
              const normName = normalizeName(ch.name);

              if (bdPresetsMap[normName] && (isBD || bdPresetsMap[normName].isCustomSource)) {
                const matchedPreset = bdPresetsMap[normName];
                const newStreams = secureStreams.filter(stream => !matchedPreset.servers.some(srv => srv.url === stream.url));
                if (newStreams.length > 0) {
                  const mappedNewStreams = newStreams.map((stream, sIdx) => ({ id: `${matchedPreset.id}-iptv-srv-${sIdx}`, name: stream.quality ? `Primary Server (${stream.quality.toUpperCase()})` : `Primary Server`, url: stream.url, type: "hls" }));
                  matchedPreset.servers = [...mappedNewStreams, ...matchedPreset.servers.filter(s => isSecure(s.url))];
                  matchedPreset.url = mappedNewStreams[0].url;
                }
                return; 
              }

              compiled.push({
                id: ch.id, name: ch.name, logo: channelLogo, country: countryInfo ? countryInfo.name : ch.country, countryCode: ch.country.toUpperCase(), countryFlag: countryInfo ? countryInfo.flag : "🏳️",
                category: ch.categories && ch.categories.length > 0 ? (categoriesMap[ch.categories[0]] || ch.categories[0]) : "General",
                description: ch.network ? `Broadcasting live network. Part of the ${ch.network} network.` : `Official live television stream for ${ch.name}.`,
                url: secureStreams[0].url,
                servers: secureStreams.map((srv, idx) => ({ id: `${ch.id}-srv-${idx}`, name: srv.quality ? `Server ${idx + 1} (${srv.quality.toUpperCase()})` : `Server ${idx + 1}`, url: srv.url, type: "hls" }))
              });
            });

            const compiledMapByTvgId = new Map();
            const compiledMapByName = new Map();
            compiled.forEach(c => {
               if(c.tvgId) compiledMapByTvgId.set(c.tvgId, c);
               compiledMapByTvgId.set(c.id, c);
               compiledMapByName.set(normalizeName(c.name), c);
            });
            const standaloneCustomMapByTvgId = new Map();
            const standaloneCustomMapByName = new Map();

            allCustomChannels.forEach(customCh => {
              const normName = normalizeName(customCh.name);

              if (customCh.tvgId) {
                matchedChannel = bdPresetsCopy.find(c => c.id === customCh.tvgId || c.tvgId === customCh.tvgId) || 
                                 compiledMapByTvgId.get(customCh.tvgId) || 
                                 standaloneCustomMapByTvgId.get(customCh.tvgId);
              }

              if (matchedChannel) {
                customCh.servers.forEach(srv => {
                  if (isSecure(srv.url) && !matchedChannel.servers.some(s => s.url === srv.url)) matchedChannel.servers.push({ id: srv.id, name: srv.name, url: srv.url, type: "hls" });
                });
                if (!matchedChannel.logo && customCh.logo) matchedChannel.logo = customCh.logo;
              } else if (bdPresetsMap[normName]) {
                const preset = bdPresetsMap[normName];
                if (isSecure(customCh.url) && !preset.servers.some(s => s.url === customCh.url)) {
                  preset.servers.push({ id: customCh.servers[0].id, name: customCh.servers[0].name, url: customCh.url, type: "hls" });
                  if (!preset.logo && customCh.logo) preset.logo = customCh.logo;
                }
              } else {
                const existingCustom = standaloneCustomMapByName.get(normName);
                if (existingCustom) {
                  if (isSecure(customCh.url) && !existingCustom.servers.some(s => s.url === customCh.url)) existingCustom.servers.push(customCh.servers[0]);
                } else {
                  if (isSecure(customCh.url)) {
                    standaloneCustomChannels.push(customCh);
                    if (customCh.tvgId) standaloneCustomMapByTvgId.set(customCh.tvgId, customCh);
                    standaloneCustomMapByName.set(normName, customCh);
                  }
                }
              }
            });

            const deduplicateByUrl = (channelList) => {
              const seen = new Set();
              return channelList.filter(ch => {
                if (!ch.url) return false;
                const url = ch.url.trim();
                if (seen.has(url)) return false;
                seen.add(url);
                return true;
              });
            };

            const finalCompiled = deduplicateByUrl([...compiled, ...bdPresetsCopy.filter(c => isSecure(c.url)), ...standaloneCustomChannels]);
            setGlobalChannels(finalCompiled);
            
            const parsedBdApi = deduplicateByUrl(parseBdM3u(bdM3uText));
            setBdApiChannels(parsedBdApi);
            
            // Filters only wc.m3u (m3u8 channels) and Tapmad playlist in the Featured channel list
            let dynamicCurated = allCustomChannels.filter(ch => {
              if (ch.sourceName === "Tapmad BD") {
                return isSecure(ch.url);
              }
              if (ch.sourceName === "WC IPTV") {
                return isSecure(ch.url) && ch.url.toLowerCase().includes('.m3u8');
              }
              return false;
            });

            const updatedCurated = deduplicateByUrl(dynamicCurated);
            setCuratedChannels(updatedCurated);
            setChannels(prev => (prev === CURATED_CHANNELS || prev.length === 0) ? updatedCurated : prev);
            
            setCurrentChannel(prev => {
              if (!prev && updatedCurated.length > 0) return updatedCurated[0];
              return prev;
            });

            // Asynchronously run reachability checks on curated channels and prioritize active ones to the top
            setTimeout(async () => {
              try {
                const checkedChannels = await Promise.all(
                  updatedCurated.map(async (ch) => {
                    const isActive = await testStreamReachability(ch.url);
                    return { ...ch, isActive };
                  })
                );

                const sortedCurated = checkedChannels.sort((a, b) => {
                  if (a.isActive && !b.isActive) return -1;
                  if (!a.isActive && b.isActive) return 1;
                  return 0; // Maintain original playlist order otherwise
                });

                setCuratedChannels(sortedCurated);
                setChannels(prev => (prev === CURATED_CHANNELS || prev.length === 0 || JSON.stringify(prev) === JSON.stringify(updatedCurated)) ? sortedCurated : prev);
                
                const activeCount = sortedCurated.filter(c => c.isActive).length;
                if (activeCount > 0) {
                  triggerToast(`Prioritized ${activeCount} active curated channels to the top!`);
                }
              } catch (reachError) {
                console.error("Reachability check failed", reachError);
              }
            }, 500);
            
            const activeCountryCodes = new Set(finalCompiled.map(ch => ch.countryCode));
            const sortedCountries = countriesRes.filter(c => activeCountryCodes.has(c.code.toUpperCase())).map(c => ({ code: c.code.toLowerCase(), name: `${c.flag} ${c.name}` })).sort((a, b) => a.name.localeCompare(b.name));
            setDynamicCountries(sortedCountries);

            const activeCategorySet = new Set(finalCompiled.map(ch => ch.category));
            const knownCategories = new Set(categoriesRes.map(c => c.name));
            const sortedCategories = categoriesRes.filter(c => activeCategorySet.has(c.name)).map(c => ({ id: c.id, name: c.name, icon: getCategoryIcon(c.id) }));
            activeCategorySet.forEach(cat => { if (!knownCategories.has(cat)) sortedCategories.push({ id: cat.toLowerCase().replace(/[^a-z0-9]/g, '-'), name: cat, icon: "tv" }); });

            const categoryCounts = {};
            finalCompiled.forEach(ch => { if (ch.category) categoryCounts[ch.category] = (categoryCounts[ch.category] || 0) + 1; });
            sortedCategories.sort((a, b) => (categoryCounts[b.name] || 0) - (categoryCounts[a.name] || 0));
            setDynamicCategories(sortedCategories.slice(0, 10));

            triggerToast(`Successfully synced local APIs with ${finalCompiled.length.toLocaleString()} world channels.`);
          } catch (err) {
            console.error("Database initialization failed", err);
            triggerToast("Failed to compile global IPTV database.");
          } finally {
            setIsLoadingGlobal(false);
          }
        };

        fetchGlobalDatabase();
      }, []);

      useEffect(() => { try { localStorage.setItem("globalstream_favs", JSON.stringify(favorites)); } catch(e){} }, [favorites]);
      useEffect(() => { if (currentChannel) { try { localStorage.setItem("globalstream_last_channel", JSON.stringify(currentChannel)); } catch(e){} } }, [currentChannel]);

      useEffect(() => {
        const handleClickOutside = (e) => {
          if (!e.target.closest('.dropdown-container') && !e.target.closest('.menu-container')) { setIsCategoryOpen(false); setIsCountryOpen(false); setIsMenuOpen(false); }
        };
        document.addEventListener('mousedown', handleClickOutside); document.addEventListener('touchstart', handleClickOutside);
        return () => { document.removeEventListener('mousedown', handleClickOutside); document.removeEventListener('touchstart', handleClickOutside); };
      }, []);

      const toggleFavorite = (channelId, e) => {
        if (e) e.stopPropagation();
        if (favorites.includes(channelId)) { setFavorites(prev => prev.filter(id => id !== channelId)); triggerToast("Removed from favorites"); }
        else { setFavorites(prev => [...prev, channelId]); triggerToast("Added to favorites"); }
      };

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (viewState !== "player") return;
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
          switch (e.key.toLowerCase()) {
            case ' ': e.preventDefault(); togglePlayPause(); break;
            case 'f': e.preventDefault(); triggerFullscreen(); break;
            case 'm': e.preventDefault(); setIsMuted(prev => !prev); break;
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [currentChannel, viewState, isPlaying, isMuted]);

      useEffect(() => {
        const video = videoRef.current;
        if (!video) return;
        video.volume = Math.min((isMuted ? 0 : volumeLevel) / 100, 1.0);
      }, [volumeLevel, isMuted, viewState]);

      // Real-time Playhead Watchdog: Automatically skips gaps or stalls (replicates VLC resilience)
      useEffect(() => {
        const video = videoRef.current;
        if (!video || viewState !== "player") return;

        const watchdogInterval = setInterval(() => {
          if (isPlaying && !video.paused) {
            const buffered = video.buffered;
            const currentTime = video.currentTime;

            // Scan for micro-buffer gaps right in front of the active playhead position
            for (let i = 0; i < buffered.length; i++) {
              const start = buffered.start(i);
              
              if (currentTime < start && (start - currentTime) < 1.8) {
                console.warn(`[Watchdog] Nudging playhead past unbuffered gap: ${currentTime.toFixed(2)} -> ${start.toFixed(2)}`);
                video.currentTime = start + 0.1;
                return;
              }
            }

            // Fallback nudge if player is waiting for data but stuck in a stall state
            if (video.readyState < 3) {
              console.warn("[Watchdog] Stream stalled. Nudging playhead to skip packet misalignment.");
              video.currentTime += 0.25;
            }
          }
        }, 2000);

        return () => clearInterval(watchdogInterval);
      }, [isPlaying, activeSource, viewState]);

      useEffect(() => {
        if (viewState !== "player" || !activeSource) return;
        setVideoError(null); setIsPlaying(true);
        const video = videoRef.current;
        if (!video) return;
        destroyHls();
        const resolvedUrl = activeSource.url;

        // Stream Failure fallback pipeline trigger without CORS Proxies
        const handleStreamFailure = () => {
          if (isManualServerSelectionRef.current) {
            setVideoError(`The selected server failed to connect. Please try another source manually.`); destroyHls(); return;
          }
          if (activeServerIndex < currentChannelSources.length - 1) {
            setActiveServerIndex(prev => prev + 1);
          } else {
            setVideoError("This stream connection failed to connect. All alternative sources exhausted."); destroyHls();
          }
        };

        const isTs = resolvedUrl.split('?')[0].toLowerCase().endsWith('.ts') || resolvedUrl.toLowerCase().includes('.ts?');
        const isMp4 = resolvedUrl.split('?')[0].toLowerCase().endsWith('.mp4') || resolvedUrl.toLowerCase().includes('.mp4?');

        if (isTs) {
          if (typeof mpegts !== 'undefined' && mpegts.getFeatureList().mseLivePlayback) {
            const mpegtsPlayer = mpegts.createPlayer({
              type: 'mse',
              isLive: true,
              url: resolvedUrl
            }, {
              enableWorker: true,
              lazyLoadMaxDuration: 3 * 60,
              seekType: 'range'
            });
            mpegtsPlayerRef.current = mpegtsPlayer;
            mpegtsPlayer.attachMediaElement(video);
            mpegtsPlayer.load();
            mpegtsPlayer.play().catch(err => setIsPlaying(false));
            mpegtsPlayer.on(mpegts.Events.ERROR, (type, detail, info) => {
              console.error("mpegts playback fallback error", type, detail, info);
              handleStreamFailure();
            });
          } else {
            video.src = resolvedUrl;
            video.addEventListener('error', handleStreamFailure);
            video.addEventListener('loadedmetadata', () => video.play().catch(err => setIsPlaying(false)));
          }
        } else if (isMp4) {
          video.src = resolvedUrl;
          video.addEventListener('error', handleStreamFailure);
          video.addEventListener('loadedmetadata', () => video.play().catch(err => setIsPlaying(false)));
        } else if (Hls.isSupported()) {
          const hlsConfig = { 
            enableWorker: true, 
            lowLatencyMode: false, // Disabling low-latency accumulates a larger, safer buffer to withstand packet gaps
            maxBufferLength: 30, 
            maxMaxBufferLength: 60,
            maxBufferHole: 2.0, // Highly relaxed gap skip tolerance (Crucial for Toffee BD)
            nudgeOffset: 0.2,
            nudgeMaxRetry: 25,
            stretchShortVideoTrack: true, // Auto-aligns short video tracks with audio tracks to prevent black-screen stalls
            maxAudioFramesDrift: 2.5,
            forceKeyFrameOnDiscontinuity: true,
            dtsgtsOffsetTolerance: 1.0, // Permits up to 1 second of timestamp drift without freezing the stream
            xhrSetup: function (xhr) { xhr.withCredentials = false; } 
          };

          const hls = new Hls(hlsConfig); 
          hlsRef.current = hls;
          hls.loadSource(resolvedUrl); 
          hls.attachMedia(video);
          
          hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(err => setIsPlaying(false)));
          
          let mediaErrorCount = 0;
          hls.on(Hls.Events.ERROR, (event, data) => {
            if (data.fatal) {
              if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                if (data.details === Hls.ErrorDetails.MANIFEST_LOAD_ERROR || data.details === Hls.ErrorDetails.MANIFEST_LOAD_TIMEOUT) {
                  handleStreamFailure();
                } else {
                  hls.startLoad();
                }
              } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                mediaErrorCount++;
                if (mediaErrorCount <= 3) {
                  hls.recoverMediaError();
                } else {
                  console.warn("Fatal media error recovery limit reached. Falling back...");
                  handleStreamFailure();
                }
              } else {
                handleStreamFailure();
              }
            }
          });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = resolvedUrl;
          video.addEventListener('error', handleStreamFailure);
          video.addEventListener('loadedmetadata', () => video.play().catch(err => setIsPlaying(false)));
        } else {
          setVideoError("Playback is not natively supported on this browser.");
        }

        return () => { destroyHls(); video.removeEventListener('error', handleStreamFailure); };

    if ('serviceWorker' in navigator) {
