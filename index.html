    function ChannelLogo({ name, logoUrl }) {
      const [isError, setIsError] = useState(!logoUrl);

      useEffect(() => {
        setIsError(!logoUrl);
      }, [logoUrl]);

      if (isError) {
        let hash = 0;
        for (let i = 0; i < name.length; i++) {
          hash = name.charCodeAt(i) + ((hash << 5) - hash);
        }
        const hue = Math.abs(hash % 360);
        const bgStyle = {
          background: `linear-gradient(135deg, hsl(${hue}, 70%, 40%) 0%, hsl(${(hue + 60) % 360}, 80%, 28%) 100%)`
        };

        const initials = name
          .replace(/[^a-zA-Z0-9 ]/g, "")
          .split(" ")
          .filter(Boolean)
          .map(w => w[0])
          .slice(0, 2)
          .join("")
          .toUpperCase() || name.substring(0, 2).toUpperCase();

        return (
          <div style={bgStyle} className="w-full h-full flex items-center justify-center text-white font-extrabold text-[11px] tracking-wider shadow-inner select-none uppercase">
            {initials}
          </div>
        );
      }

      return (
        <img
          src={logoUrl}
          alt=""
          loading="lazy"
          className="w-full h-full object-contain p-1"
          onError={() => setIsError(true)}
        />
      );
    }

    function PlayerOverlay({ videoRef, hlsRef, isPlaying, togglePlayPause, triggerFullscreen, isMuted, setIsMuted }) {
      const [currentTime, setCurrentTime] = useState(0);
      const [duration, setDuration] = useState(0);
      const [showControls, setShowControls] = useState(true);
      const [isFullscreen, setIsFullscreen] = useState(false);
      const controlsTimeoutRef = useRef(null);

      useEffect(() => {
        const video = videoRef.current;
        if (!video) return;

        const updateTime = () => setCurrentTime(video.currentTime);
        const updateDuration = () => setDuration(video.duration);

        video.addEventListener('timeupdate', updateTime);
        video.addEventListener('durationchange', updateDuration);
        
        return () => {
          video.removeEventListener('timeupdate', updateTime);
          video.removeEventListener('durationchange', updateDuration);
        };
      }, [videoRef]);

      useEffect(() => {
        const handleFullscreenChange = () => setIsFullscreen(!!(document.fullscreenElement || document.webkitFullscreenElement));
        document.addEventListener('fullscreenchange', handleFullscreenChange);
        document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
        return () => {
          document.removeEventListener('fullscreenchange', handleFullscreenChange);
          document.removeEventListener('webkitfullscreenchange', handleFullscreenChange);
        };
      }, []);

      // Automatically hide controls after 5 seconds of inactivity when playing
      useEffect(() => {
        if (showControls && isPlaying) {
          if (controlsTimeoutRef.current) clearTimeout(controlsTimeoutRef.current);
          controlsTimeoutRef.current = setTimeout(() => {
            setShowControls(false);
          }, 5000);
        }
        return () => {
          if (controlsTimeoutRef.current) clearTimeout(controlsTimeoutRef.current);
        };
      }, [showControls, isPlaying]);

      // Handle pointer interactions and tap toggles properly
      useEffect(() => {
        const showControlsTemporarily = () => {
          setShowControls(true);
        };

        const toggleControlsOnTap = (e) => {
          // If clicking an interactive button or slider, don't toggle visibility
          if (e.target.closest('.pointer-events-auto')) return;
          setShowControls(prev => !prev);
        };

        const container = videoRef.current?.parentElement;
        if (container) {
          container.addEventListener('mousemove', showControlsTemporarily);
          container.addEventListener('touchstart', showControlsTemporarily, { passive: true });
          container.addEventListener('click', toggleControlsOnTap);
        }

        return () => {
          if (container) {
            container.removeEventListener('mousemove', showControlsTemporarily);
            container.removeEventListener('touchstart', showControlsTemporarily);
            container.removeEventListener('click', toggleControlsOnTap);
          }
        };
      }, [videoRef]);

      const formatTime = (time) => {
        if (isNaN(time) || !isFinite(time)) return "00:00";
        const h = Math.floor(time / 3600);
        const m = Math.floor((time % 3600) / 60);
        const s = Math.floor(time % 60);
        if (h > 0) return `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      };

      const handleSeek = (e) => {
        const rect = e.currentTarget.getBoundingClientRect();
        const pos = (e.clientX - rect.left) / rect.width;
        if (videoRef.current && duration && isFinite(duration)) {
          videoRef.current.currentTime = pos * duration;
        }
      };

      const handleGoToLive = () => {
        if (hlsRef.current && hlsRef.current.liveSyncPosition) {
          videoRef.current.currentTime = hlsRef.current.liveSyncPosition;
        } else if (videoRef.current && isFinite(videoRef.current.duration)) {
          videoRef.current.currentTime = videoRef.current.duration;
        }
      };

      const isLive = !isFinite(duration) || duration === 0 || (videoRef.current && duration - currentTime < 15);

      return (
        <div className={`absolute inset-0 z-20 pointer-events-none flex flex-col justify-end transition-opacity duration-300 ${showControls || !isPlaying ? 'opacity-100' : 'opacity-0'}`}>
          <div className="absolute inset-0 bg-gradient-to-t from-slate-950/90 via-transparent to-transparent opacity-90"></div>
          
          <div className="relative p-4 md:p-6 w-full flex flex-col gap-3 pointer-events-auto">
            {/* Modern Hover-Expand Seek Bar */}
            <div 
              className="group/scrubber w-full h-1.5 md:h-2 bg-slate-700/50 rounded-full cursor-pointer relative overflow-visible flex items-center transition-all hover:h-2 md:hover:h-3"
              onClick={handleSeek}
            >
              <div 
                className="h-full bg-brand-500 rounded-full relative shadow-[0_0_10px_rgba(139,92,246,0.6)]" 
                style={{ width: `${duration > 0 && isFinite(duration) ? (currentTime / duration) * 100 : 100}%` }}
              >
                <div className="absolute right-0 top-1/2 -translate-y-1/2 translate-x-1/2 w-3 h-3 md:w-4 md:h-4 bg-white rounded-full scale-0 group-hover/scrubber:scale-100 transition-transform shadow-lg"></div>
              </div>
            </div>

            {/* Controls Main Row */}
            <div className="flex items-center justify-between text-white mt-1">
              <div className="flex items-center gap-4 md:gap-6">
                <button onClick={togglePlayPause} className="hover:text-brand-400 hover:scale-110 transition-all focus:outline-none drop-shadow-md">
                  {isPlaying ? (
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="4" height="16" x="6" y="4"/><rect width="4" height="16" x="14" y="4"/></svg>
                  ) : (
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                  )}
                </button>

                <button onClick={() => setIsMuted(!isMuted)} className="hover:text-brand-400 hover:scale-110 transition-all focus:outline-none drop-shadow-md">
                  {isMuted ? (
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" x2="15" y1="9" y2="15"/><line x1="15" x2="23" y1="9" y2="15"/></svg>
                  ) : (
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
                  )}
                </button>

                <div className="text-[11px] md:text-sm font-medium tabular-nums text-slate-200 drop-shadow-md flex gap-1 items-center">
                  <span className="text-white">{formatTime(currentTime)}</span>
                  {isFinite(duration) && duration > 0 ? (
                    <>
                      <span className="text-slate-500 font-normal">/</span> 
                      <span>{formatTime(duration)}</span>
                    </>
                  ) : null}
                </div>
              </div>

              <div className="flex items-center gap-3 md:gap-5">
                <button 
                  onClick={handleGoToLive} 
                  className={`flex items-center gap-1.5 md:gap-2 text-[10px] md:text-xs font-bold px-2.5 md:px-3 py-1 md:py-1.5 rounded-lg border transition-all shadow-sm ${
                    isLive 
                      ? 'bg-red-600/20 text-red-500 border-red-600/30' 
                      : 'bg-slate-800/80 text-slate-300 hover:bg-slate-700 hover:text-white border-slate-700 backdrop-blur-sm'
                  }`}
                >
                  <span className={`w-1.5 h-1.5 md:w-2 md:h-2 rounded-full ${isLive ? 'bg-red-500 animate-pulse' : 'bg-slate-400'}`} />
                  {isLive ? 'LIVE' : 'GO TO LIVE'}
                </button>

                <button onClick={triggerFullscreen} className="hover:text-brand-400 hover:scale-110 transition-all focus:outline-none drop-shadow-md">
                  {isFullscreen ? (
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/></svg>
                  ) : (
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
                  )}
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [viewState, setViewState] = useState("home"); // "home" or "player"
      const [activeMobileTab, setActiveMobileTab] = useState("home"); // "home", "search", "favorites", "settings"

      const [activeCategory, setActiveCategory] = useState("curated");
      const [curatedChannels, setCuratedChannels] = useState(CURATED_CHANNELS);
      const [channels, setChannels] = useState(CURATED_CHANNELS);
      const [curatedSelected, setCuratedSelected] = useState(true);
      
      const [globalChannels, setGlobalChannels] = useState([]);
      const [bdApiChannels, setBdApiChannels] = useState([]); // Dynamic parsed bd.m3u channels
      const [isLoadingGlobal, setIsLoadingGlobal] = useState(false);
      
      const [dynamicCountries, setDynamicCountries] = useState([]);
      const [dynamicCategories, setDynamicCategories] = useState([]);

      const [selectedCountryCode, setSelectedCountryCode] = useState("");
      const [searchQuery, setSearchQuery] = useState("");
      const [selectedCategoryFilter, setSelectedCategoryFilter] = useState("All");
      
      const [favorites, setFavorites] = useState(() => {
        try {
          const saved = localStorage.getItem("globalstream_favs");
          return saved ? JSON.parse(saved) : [];
        } catch (e) {
          return [];
        }
      });
      
      const [showFavoritesOnly, setShowFavoritesOnly] = useState(false);

      const [currentChannel, setCurrentChannel] = useState(() => {
        try {
          const saved = localStorage.getItem("globalstream_last_channel");
          return saved ? JSON.parse(saved) : CURATED_CHANNELS[0];
        } catch (e) {
          return CURATED_CHANNELS[0];
        }
      });

      const [activeServerIndex, setActiveServerIndex] = useState(0);
      const [videoError, setVideoError] = useState(null);
      const [isLoadingList, setIsLoadingList] = useState(false);
      const [isPlaying, setIsPlaying] = useState(true);
      const [isMuted, setIsMuted] = useState(false);
      const [volumeLevel, setVolumeLevel] = useState(100); // 0 to 200 volume scale
      const [isCategoryOpen, setIsCategoryOpen] = useState(false);
      const [isCountryOpen, setIsCountryOpen] = useState(false);
      const [isMenuOpen, setIsMenuOpen] = useState(false);
      const [isCopied, setIsCopied] = useState(false);
      const [toastMessage, setToastMessage] = useState(null);
      const [useProxy, setUseProxy] = useState(false);

      // Modals State
      const [isNsPlayerModalOpen, setIsNsPlayerModalOpen] = useState(false);
      const [seeAllData, setSeeAllData] = useState(null); // { title: string, channels: array }
      const [seeAllSearchQuery, setSeeAllSearchQuery] = useState(""); // Internal search inside "See All" popup
      const [copiedLinkId, setCopiedLinkId] = useState(null);
      
      const isManualServerSelectionRef = useRef(false);
      const [visibleLimit, setVisibleLimit] = useState(48);

      const playerContainerRef = useRef(null);
      const videoRef = useRef(null);
      const hlsRef = useRef(null);

      // Bangladeshi Carousel channels: Sorted by popularity, and prioritizing Sports channels first
      const bdCarouselChannels = useMemo(() => {
        return [...bdApiChannels].sort((a, b) => {
          const aIsSport = (a.category && a.category.toLowerCase().includes('sport')) || a.name.toLowerCase().includes('sport') || a.name.toLowerCase().includes('khela');
          const bIsSport = (b.category && b.category.toLowerCase().includes('sport')) || b.name.toLowerCase().includes('sport') || b.name.toLowerCase().includes('khela');
          
          if (aIsSport && !bIsSport) return -1;
          if (!aIsSport && bIsSport) return 1;
          
          // Popularity sort descending: (server count proxy + custom weight modifier for curated/preset flags)
          const scoreA = (a.servers || []).length + (a.id.startsWith('bd-') || a.id.startsWith('curated-') ? 100 : 0);
          const scoreB = (b.servers || []).length + (b.id.startsWith('bd-') || b.id.startsWith('curated-') ? 100 : 0);
          return scoreB - scoreA;
        });
      }, [bdApiChannels]);

      // All Sports Carousel channels: Sorted by popularity (alt server count)
      const sportsCarouselChannels = useMemo(() => {
        return globalChannels
          .filter(ch => 
            ch.category && 
            ch.category.toLowerCase().includes('sport') &&
            !ch.isCustomSource && 
            !ch.id.startsWith('bd-')
          )
          .sort((a, b) => {
            const scoreA = (a.servers || []).length + (a.id.startsWith('curated-') ? 100 : 0);
            const scoreB = (b.servers || []).length + (b.id.startsWith('curated-') ? 100 : 0);
            return scoreB - scoreA;
          });
      }, [globalChannels]);

      // Computed aggregation of all channels to cleanly resolve favorites mapping across multiple sources
      const allUniqueChannels = useMemo(() => {
        const map = new Map();
        curatedChannels.forEach(ch => map.set(ch.id, ch));
        bdApiChannels.forEach(ch => map.set(ch.id, ch));
        globalChannels.forEach(ch => map.set(ch.id, ch));
        return Array.from(map.values());
      }, [curatedChannels, bdApiChannels, globalChannels]);

      const triggerToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 4000);
      };

      useEffect(() => {
        if (!window.history.state) {
          window.history.replaceState({ view: "home" }, "");
        }

        const handlePopState = (event) => {
          if (event.state && event.state.view === "player") {
            const channelId = event.state.channelId;
            const found = globalChannels.find(c => c.id === channelId) || curatedChannels.find(c => c.id === channelId);
            if (found) {
              setCurrentChannel(found);
            }
            setViewState("player");
          } else {
            setViewState("home");
          }
        };

        window.addEventListener("popstate", handlePopState);
        return () => window.removeEventListener("popstate", handlePopState);
      }, [globalChannels, curatedChannels]);

      const handleSelectChannel = (channel) => {
        setActiveServerIndex(0);
        setUseProxy(false);
        isManualServerSelectionRef.current = false;
        setCurrentChannel(channel);
        setViewState("player");
        
        window.history.pushState({ view: "player", channelId: channel.id }, "");
      };

      const handleBackToHome = () => {
        setViewState("home");
        if (window.history.state && window.history.state.view === "player") {
          window.history.back();
        }
      };

      const activeChannelWithFreshData = useMemo(() => {
        if (!currentChannel) return null;
        const fresh = globalChannels.find(c => c.id === currentChannel.id) || curatedChannels.find(c => c.id === currentChannel.id);
        return fresh || currentChannel;
      }, [currentChannel, globalChannels, curatedChannels]);

      const currentChannelSources = useMemo(() => {
        const channel = activeChannelWithFreshData;
        if (!channel) return [];
        const sources = channel.servers || [{ id: "primary", name: "Backup Server 2", url: channel.url }];
        const seenUrls = new Set();
        return sources.filter(srv => {
          if (seenUrls.has(srv.url)) return false;
          seenUrls.add(srv.url);
          return true;
        });
      }, [activeChannelWithFreshData]);

      const activeSource = useMemo(() => {
        if (!currentChannelSources || currentChannelSources.length === 0) return null;
        return currentChannelSources[activeServerIndex] || currentChannelSources[0];
      }, [currentChannelSources, activeServerIndex]);

      useEffect(() => {
        const fetchGlobalDatabase = async () => {
          setIsLoadingGlobal(true);
          try {
            const CUSTOM_M3U_URLS = [
			  { url: 'https://raw.githubusercontent.com/sm-monirulislam/SM-Live-TV/refs/heads/main/World_Cup.m3u', name: 'wc-special' },
			  { url: 'https://raw.githubusercontent.com/abusaeeidx/BDxTV/refs/heads/main/roar-zone-playlist.m3u', name: 'RoarZone' },
			  { url: 'https://raw.githubusercontent.com/srhady/Hady/refs/heads/main/unite8_sports.m3u', name: 'unite8' },
			  { url: 'https://raw.githubusercontent.com/sm-monirulislam/RoarZone-Auto-Update-playlist/refs/heads/main/RoarZone.m3u', name: 'RoarZone2' },
              { url: 'https://raw.githubusercontent.com/srhady/tapmad-bd/refs/heads/main/tapmad_bd.m3u', name: 'Tapmad BD' },
			  { url: 'https://raw.githubusercontent.com/sm-monirulislam/Toffee-Auto-Update-Playlist/refs/heads/main/toffee_all_player.m3u', name: 'Toffee' },
			  { url: 'https://aponn.vercel.app/iptv.m3u', name: 'fifawc' },
              { url: 'https://raw.githubusercontent.com/srhady/fifaplus/refs/heads/main/fifa_live.m3u', name: 'FIFA Plus' }
            ];

            const parseM3U = (m3uText, sourceName) => {
              const lines = m3uText.split(/\r?\n/);
              const parsedChannels = [];
              const channelMapByTvgId = {};
              let currentCh = null;

              for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line.startsWith('#EXTINF:')) {
                  currentCh = {};
                  const tvgIdMatch = line.match(/tvg-id="([^"]+)"/);
                  const tvgNameMatch = line.match(/tvg-name="([^"]+)"/);
                  const tvgLogoMatch = line.match(/tvg-logo="([^"]+)"/);
                  const groupTitleMatch = line.match(/group-title="([^"]+)"/);
                  const nameMatch = line.split(',');
                  const fallbackName = nameMatch.length > 1 ? nameMatch[nameMatch.length - 1].trim() : "Unknown Channel";

                  currentCh.tvgId = (tvgIdMatch && tvgIdMatch[1]) ? tvgIdMatch[1] : null;
                  currentCh.name = (tvgNameMatch && tvgNameMatch[1]) ? tvgNameMatch[1] : fallbackName;
                  currentCh.logo = (tvgLogoMatch && tvgLogoMatch[1]) ? tvgLogoMatch[1] : "";
                  currentCh.category = (groupTitleMatch && groupTitleMatch[1]) ? groupTitleMatch[1] : "Sports";
                } else if (line && !line.startsWith('#') && currentCh) {
                  const url = line;
                  const tvgId = currentCh.tvgId;

                  if (tvgId && channelMapByTvgId[tvgId]) {
                    const existingCh = channelMapByTvgId[tvgId];
                    const serverIdx = existingCh.servers.length;
                    const urlExists = existingCh.servers.some(s => s.url === url);
                    if (!urlExists) {
                      existingCh.servers.push({
                        id: `${existingCh.id}-srv-${serverIdx}`,
                        name: `Backup Server ${serverIdx + 1} (${sourceName})`,
                        url: url,
                        type: "hls"
                      });
                    }
                  } else {
                    currentCh.url = url;
                    currentCh.id = `custom-${currentCh.name.toLowerCase().replace(/[^a-z0-9]/g, '')}-${Math.random().toString(36).substr(2, 5)}`;
                    currentCh.type = "hls";
                    currentCh.description = `Streamed from ${sourceName} Playlist.`;
                    currentCh.isCustomSource = true;
                    currentCh.sourceName = sourceName;
                    currentCh.servers = [{ id: `${currentCh.id}-srv-0`, name: `Backup Server (${sourceName})`, url: url, type: "hls" }];
                    parsedChannels.push(currentCh);
                    if (tvgId) {
                      channelMapByTvgId[tvgId] = currentCh;
                    }
                  }
                  currentCh = null;
                }
              }
              return parsedChannels;
            };

            const parseBdM3u = (m3uText) => {
              const lines = m3uText.split(/\r?\n/);
              const parsedChannels = [];
              const channelMapByTvgId = {};
              let currentCh = null;

              for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line.startsWith('#EXTINF:')) {
                  currentCh = {};
                  const tvgIdMatch = line.match(/tvg-id="([^"]+)"/);
                  const tvgNameMatch = line.match(/tvg-name="([^"]+)"/);
                  const tvgLogoMatch = line.match(/tvg-logo="([^"]+)"/);
                  const groupTitleMatch = line.match(/group-title="([^"]+)"/);
                  const nameMatch = line.split(',');
                  const fallbackName = nameMatch.length > 1 ? nameMatch[nameMatch.length - 1].trim() : "Unknown Channel";

                  currentCh.tvgId = (tvgIdMatch && tvgIdMatch[1]) ? tvgIdMatch[1] : null;
                  currentCh.name = (tvgNameMatch && tvgNameMatch[1]) ? tvgNameMatch[1] : fallbackName;
                  currentCh.logo = (tvgLogoMatch && tvgLogoMatch[1]) ? tvgLogoMatch[1] : "";
                  currentCh.category = (groupTitleMatch && groupTitleMatch[1]) ? groupTitleMatch[1] : "General";
                } else if (line && !line.startsWith('#') && currentCh) {
                  const url = line;
                  const tvgId = currentCh.tvgId;

                  if (tvgId && channelMapByTvgId[tvgId]) {
                    const existingCh = channelMapByTvgId[tvgId];
                    const serverIdx = existingCh.servers.length;
                    const urlExists = existingCh.servers.some(s => s.url === url);
                    if (!urlExists) {
                      existingCh.servers.push({
                        id: `${existingCh.id}-srv-${serverIdx}`,
                        name: `Server ${serverIdx + 1}`,
                        url: url,
                        type: "hls"
                      });
                    }
                  } else {
                    currentCh.url = url;
                    currentCh.id = `bd-api-${currentCh.name.toLowerCase().replace(/[^a-z0-9]/g, '')}-${Math.random().toString(36).substr(2, 5)}`;
                    currentCh.type = "hls";
                    currentCh.country = "Bangladesh";
                    currentCh.countryCode = "BD";
                    currentCh.countryFlag = "🇧🇩";
                    currentCh.description = `Streamed via official iptv-org country index.`;
                    currentCh.servers = [{ id: `${currentCh.id}-srv-0`, name: "Primary Stream", url: url, type: "hls" }];
                    parsedChannels.push(currentCh);
                    if (tvgId) {
                      channelMapByTvgId[tvgId] = currentCh;
                    }
                  }
                  currentCh = null;
                }
              }
              return parsedChannels;
            };

            const customM3UPromises = CUSTOM_M3U_URLS.map(source =>
              fetch(source.url)
                .then(res => res.text())
                .then(text => parseM3U(text, source.name))
                .catch(err => {
                  console.warn(`Failed to fetch custom M3U: ${source.url}`, err);
                  return [];
                })
            );

            const [channelsRes, streamsRes, countriesRes, categoriesRes, logosRes, bdM3uText, ...customM3UResults] = await Promise.all([
              fetch('https://iptv-org.github.io/api/channels.json').then(r => r.json()),
              fetch('https://iptv-org.github.io/api/streams.json').then(r => r.json()),
              fetch('https://iptv-org.github.io/api/countries.json').then(r => r.json()),
              fetch('https://iptv-org.github.io/api/categories.json').then(r => r.json()),
              fetch('https://iptv-org.github.io/api/logos.json').then(r => r.json()).catch(() => []),
              fetch('https://iptv-org.github.io/iptv/countries/bd.m3u').then(r => r.text()).catch(() => ""),
              ...customM3UPromises
            ]);

            const streamsMap = {};
            streamsRes.forEach(stream => {
              if (stream.status !== 'blocked') {
                if (!streamsMap[stream.channel]) streamsMap[stream.channel] = [];
                streamsMap[stream.channel].push(stream);
              }
            });

            const logosMap = {};
            logosRes.forEach(logo => {
              if (logo.url && (logo.in_use || !logosMap[logo.channel])) logosMap[logo.channel] = logo.url;
            });

            const countriesMap = {};
            countriesRes.forEach(c => countriesMap[c.code.toUpperCase()] = c);

            const categoriesMap = {};
            categoriesRes.forEach(c => categoriesMap[c.id] = c.name);

            const normalizeName = (name) => {
              return name.toLowerCase()
                .replace(/\s+/g, '')
                .replace(/hd/gi, '')
                .replace(/tv/gi, '')
                .replace(/bd/gi, '')
                .replace(/[^a-z0-9]/g, '');
            };

            const bdPresetsCopy = BANGLADESH_CHANNELS_PRESET.map(ch => ({
              ...ch,
              servers: [...(ch.servers || [{ id: `${ch.id}-srv-0`, name: "Server 1 (Primary)", url: ch.url, type: "hls" }])]
            }));

            const bdPresetsMap = {};
            bdPresetsCopy.forEach(p => {
              bdPresetsMap[normalizeName(p.name)] = p;
            });

            const allCustomChannels = customM3UResults.flat();
            const standaloneCustomChannels = [];

            const compiled = [];

            channelsRes.forEach(ch => {
              const channelStreams = streamsMap[ch.id] || [];
              if (channelStreams.length === 0) return;

              const countryInfo = countriesMap[ch.country.toUpperCase()];
              const countryName = countryInfo ? countryInfo.name : ch.country;
              const countryFlag = countryInfo ? countryInfo.flag : "🏳️";

              let channelLogo = logosMap[ch.id] || ch.logo || "";
              if (channelLogo && channelLogo.startsWith("http://")) channelLogo = channelLogo.replace("http://", "https://");

              const isBD = ch.country && (ch.country.toUpperCase() === 'BD' || ch.country.toUpperCase() === 'BANGLADESH');
              const normName = normalizeName(ch.name);

              if (bdPresetsMap[normName] && (isBD || bdPresetsMap[normName].isCustomSource)) {
                const matchedPreset = bdPresetsMap[normName];
                const newStreams = channelStreams.filter(stream => !matchedPreset.servers.some(srv => srv.url === stream.url));
                if (newStreams.length > 0) {
                  const mappedNewStreams = newStreams.map((stream, sIdx) => ({
                    id: `${matchedPreset.id}-iptv-srv-${sIdx}`,
                    name: stream.quality ? `Primary Server (${stream.quality.toUpperCase()})` : `Primary Server`,
                    url: stream.url,
                    type: "hls"
                  }));
                  matchedPreset.servers = [...mappedNewStreams, ...matchedPreset.servers];
                  matchedPreset.url = mappedNewStreams[0].url;
                }
                return; 
              }

              compiled.push({
                id: ch.id,
                name: ch.name,
                logo: channelLogo,
                country: countryName,
                countryCode: ch.country.toUpperCase(),
                countryFlag: countryFlag,
                category: ch.categories && ch.categories.length > 0 ? (categoriesMap[ch.categories[0]] || ch.categories[0]) : "General",
                description: ch.network ? `Broadcasting live network. Part of the ${ch.network} network.` : `Official live television stream for ${ch.name}.`,
                url: channelStreams[0].url,
                servers: channelStreams.map((srv, idx) => ({
                  id: `${ch.id}-srv-${idx}`,
                  name: srv.quality ? `Server ${idx + 1} (${srv.quality.toUpperCase()})` : `Server ${idx + 1}`,
                  url: srv.url,
                  type: "hls"
                }))
              });
            });

            allCustomChannels.forEach(customCh => {
              const normName = normalizeName(customCh.name);
              
              let matchedChannel = null;
              
              if (customCh.tvgId) {
                for (const preset of bdPresetsCopy) {
                  if (preset.id === customCh.tvgId || preset.tvgId === customCh.tvgId) {
                    matchedChannel = preset;
                    break;
                  }
                }
                if (!matchedChannel) {
                  matchedChannel = compiled.find(c => c.id === customCh.tvgId || c.tvgId === customCh.tvgId);
                }
                if (!matchedChannel) {
                  matchedChannel = standaloneCustomChannels.find(c => c.id === customCh.tvgId || c.tvgId === customCh.tvgId);
                }
              }

              if (matchedChannel) {
                customCh.servers.forEach(srv => {
                  const urlExists = matchedChannel.servers.some(s => s.url === srv.url);
                  if (!urlExists) {
                    matchedChannel.servers.push({
                      id: srv.id,
                      name: srv.name,
                      url: srv.url,
                      type: "hls"
                    });
                  }
                });
                if (!matchedChannel.logo && customCh.logo) matchedChannel.logo = customCh.logo;
              } else if (bdPresetsMap[normName]) {
                const preset = bdPresetsMap[normName];
                const urlExists = preset.servers.some(s => s.url === customCh.url);
                if (!urlExists) {
                  preset.servers.push({
                    id: customCh.servers[0].id,
                    name: customCh.servers[0].name,
                    url: customCh.url,
                    type: "hls"
                  });
                  if (!preset.logo && customCh.logo) preset.logo = customCh.logo;
                }
              } else {
                const existingCustom = standaloneCustomChannels.find(c => normalizeName(c.name) === normName);
                if (existingCustom) {
                  const urlExists = existingCustom.servers.some(s => s.url === customCh.url);
                  if (!urlExists) existingCustom.servers.push(customCh.servers[0]);
                } else {
                  standaloneCustomChannels.push(customCh);
                }
              }
            });

            const deduplicateByUrl = (channelList) => {
              const seen = new Set();
              return channelList.filter(ch => {
                if (!ch.url) return false;
                const url = ch.url.trim();
                if (seen.has(url)) return false;
                seen.add(url);
                return true;
              });
            };

            const finalCompiled = deduplicateByUrl([...compiled, ...bdPresetsCopy, ...standaloneCustomChannels]);
            setGlobalChannels(finalCompiled);
            
            const parsedBdApi = deduplicateByUrl(parseBdM3u(bdM3uText));
            setBdApiChannels(parsedBdApi);
            
			// --- Seleted Channels from wcspecial ---
            const wcspecialSpecificNames = ["TVRI INDO", "CAZE TV BR", "TELEMUNDO HD"]; 
			
			// --- Seleted Channels from RoarZone ---
            const roarzoneSpecificNames = ["T SPORTS HD", "SOMOY TV", "BTV"];
			
			// --- Seleted Channels from RoarZone2 ---
            const roarzone2SpecificNames = ["T Sports Hd", "T Sports", "Somoy Tv", "Btv"]; 
            
            let dynamicCurated = allCustomChannels.filter(ch => 
              ch.sourceName === "Tapmad BD" || 
			  ch.sourceName === "unite800" || 
			  (ch.sourceName === "wc-special00" && wcspecialSpecificNames.includes(ch.name)) || 
              (ch.sourceName === "RoarZone00" && roarzoneSpecificNames.includes(ch.name)) || 
			  (ch.sourceName === "RoarZone002" && roarzone2SpecificNames.includes(ch.name))
            );

            const updatedCurated = deduplicateByUrl([...dynamicCurated, ...CURATED_CHANNELS]);
            setCuratedChannels(updatedCurated);
            
            setChannels(prev => {
              if (prev === CURATED_CHANNELS) {
                return updatedCurated;
              }
              return prev;
            });
            
            const activeCountryCodes = new Set(finalCompiled.map(ch => ch.countryCode));
            const sortedCountries = countriesRes
              .filter(c => activeCountryCodes.has(c.code.toUpperCase()))
              .map(c => ({
                code: c.code.toLowerCase(),
                name: `${c.flag} ${c.name}`
              }))
              .sort((a, b) => a.name.localeCompare(b.name));
            
            setDynamicCountries(sortedCountries);

            // Fetch dynamic categories
            const activeCategorySet = new Set(finalCompiled.map(ch => ch.category));
            const knownCategories = new Set(categoriesRes.map(c => c.name));

            const sortedCategories = categoriesRes
              .filter(c => activeCategorySet.has(c.name))
              .map(c => ({
                id: c.id,
                name: c.name,
                icon: getCategoryIcon(c.id)
              }));

            activeCategorySet.forEach(cat => {
              if (!knownCategories.has(cat)) {
                sortedCategories.push({
                  id: cat.toLowerCase().replace(/[^a-z0-9]/g, '-'),
                  name: cat,
                  icon: "tv" 
                });
              }
            });

            // Calculate popularity frequency to show only top 10 categories
            const categoryCounts = {};
            finalCompiled.forEach(ch => {
              if (ch.category) {
                categoryCounts[ch.category] = (categoryCounts[ch.category] || 0) + 1;
              }
            });

            // Sort categories descending by channel count
            sortedCategories.sort((a, b) => {
              const countA = categoryCounts[a.name] || 0;
              const countB = categoryCounts[b.name] || 0;
              return countB - countA;
            });

            // Slice out only the top 10 categories/genres
            const top10Categories = sortedCategories.slice(0, 10);
            setDynamicCategories(top10Categories);

            triggerToast(`Successfully synced local APIs with ${finalCompiled.length.toLocaleString()} world channels.`);
          } catch (err) {
            console.error("Database initialization failed", err);
            triggerToast("Failed to compile global IPTV database.");
          } finally {
            setIsLoadingGlobal(false);
          }
        };

        fetchGlobalDatabase();
      }, []);

      useEffect(() => {
        try {
          localStorage.setItem("globalstream_favs", JSON.stringify(favorites));
        } catch (e) {
          console.error("Failed to save favorites", e);
        }
      }, [favorites]);

      useEffect(() => {
        if (currentChannel) {
          try {
            localStorage.setItem("globalstream_last_channel", JSON.stringify(currentChannel));
          } catch (e) {
            console.error("Failed to save active channel state", e);
          }
        }
      }, [currentChannel]);

      useEffect(() => {
        const handleClickOutside = (e) => {
          if (!e.target.closest('.dropdown-container') && !e.target.closest('.menu-container')) {
            setIsCategoryOpen(false);
            setIsCountryOpen(false);
            setIsMenuOpen(false);
          }
        };
        document.addEventListener('mousedown', handleClickOutside);
        document.addEventListener('touchstart', handleClickOutside);
        return () => {
          document.removeEventListener('mousedown', handleClickOutside);
          document.removeEventListener('touchstart', handleClickOutside);
        };
      }, []);

      useEffect(() => {
        if (typeof lucide !== 'undefined') {
          // Use setTimeout to ensure React DOM has finished painting, preventing blocking main thread
          setTimeout(() => lucide.createIcons(), 10);
        }
      }, [
        viewState,
        activeMobileTab,
        isCategoryOpen,
        isCountryOpen,
        isMenuOpen,
        isNsPlayerModalOpen,
        seeAllData,
        visibleLimit,
        favorites.length,
        activeServerIndex,
        toastMessage,
        isCopied
      ]);

      const toggleFavorite = (channelId, e) => {
        if (e) e.stopPropagation();
        if (favorites.includes(channelId)) {
          setFavorites(prev => prev.filter(id => id !== channelId));
          triggerToast("Removed from favorites");
        } else {
          setFavorites(prev => [...prev, channelId]);
          triggerToast("Added to favorites");
        }
      };

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (viewState !== "player") return;
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

          switch (e.key.toLowerCase()) {
            case ' ':
              e.preventDefault();
              togglePlayPause();
              break;
            case 'f':
              e.preventDefault();
              triggerFullscreen();
              break;
            case 'm':
              e.preventDefault();
              setIsMuted(prev => !prev);
              break;
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [currentChannel, viewState, isPlaying, isMuted]);

      // Direct compatible video volume setup to bypass standard iframe CORS audio blocks
      useEffect(() => {
        const video = videoRef.current;
        if (!video) return;
        video.volume = Math.min((isMuted ? 0 : volumeLevel) / 100, 1.0);
      }, [volumeLevel, isMuted, viewState]);

      useEffect(() => {
        if (viewState !== "player" || !activeSource) return;
        setVideoError(null);
        setIsPlaying(true);

        const video = videoRef.current;
        if (!video) return;

        destroyHls();
        const resolvedUrl = activeSource.url;

        const handleStreamFailure = () => {
          if (!useProxy) {
            console.warn(`Direct stream blocked (likely CORS). Attempting Proxy Bypass...`);
            setUseProxy(true);
            return;
          }

          if (isManualServerSelectionRef.current) {
            console.warn(`Manual server selection failed. Stopping auto-switch.`);
            setVideoError(`The selected server failed to connect. Please try another source manually.`);
            destroyHls();
            return;
          }

          if (activeServerIndex < currentChannelSources.length - 1) {
            console.warn(`Server ${activeServerIndex + 1} proxy failed. Automatically trying next server...`);
            setUseProxy(false);
            setActiveServerIndex(prev => prev + 1);
          } else {
            setVideoError("This stream connection failed to connect. All alternative sources exhausted.");
            destroyHls();
          }
        };

        if (Hls.isSupported()) {
          const hlsConfig = {
            enableWorker: true,
            lowLatencyMode: true,
            maxMaxBufferLength: 20,
            manifestLoadingMaxRetry: 5,
            levelLoadingMaxRetry: 5,
            xhrSetup: function (xhr, url) {
              xhr.withCredentials = false;
            }
          };

          if (useProxy) {
            const ProxyLoader = function(config) {
              let loader = new Hls.DefaultConfig.loader(config);
              this.load = function(context, cfg, callbacks) {
                if (context.url && context.url.startsWith('http') && !context.url.includes('corsproxy.io')) {
                  context.url = 'https://corsproxy.io/?' + encodeURIComponent(context.url);
                }
                loader.load(context, cfg, callbacks);
              };
              this.abort = function() { loader.abort(); };
              this.destroy = function() { loader.destroy(); };
            };
            hlsConfig.loader = ProxyLoader;
          }

          const hls = new Hls(hlsConfig);
          hlsRef.current = hls;

          hls.loadSource(resolvedUrl);
          hls.attachMedia(video);

          hls.on(Hls.Events.MANIFEST_PARSED, () => {
            video.play().catch(err => {
              console.log("Auto-play blocked, waiting for click.", err);
              setIsPlaying(false);
            });
          });

          hls.on(Hls.Events.ERROR, (event, data) => {
            if (data.fatal) {
              switch (data.type) {
                case Hls.ErrorTypes.NETWORK_ERROR:
                  console.warn("Network error encountered on stream.");
                  if (data.details === Hls.ErrorDetails.MANIFEST_LOAD_ERROR || data.details === Hls.ErrorDetails.MANIFEST_LOAD_TIMEOUT) {
                    handleStreamFailure();
                  } else {
                    hls.startLoad();
                  }
                  break;
                case Hls.ErrorTypes.MEDIA_ERROR:
                  console.warn("Media buffer error, attempting recovery...");
                  hls.recoverMediaError();
                  break;
                default:
                  handleStreamFailure();
                  break;
              }
            }
          });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = useProxy ? `https://corsproxy.io/?${encodeURIComponent(resolvedUrl)}` : resolvedUrl;
          video.addEventListener('error', handleStreamFailure);
          video.addEventListener('loadedmetadata', () => {
            video.play().catch(err => {
              console.log("Native Autoplay blocked", err);
              setIsPlaying(false);
            });
          });
        } else {
          setVideoError("HLS playback is not natively supported on this browser.");
        }

        return () => {
          destroyHls();
          video.removeEventListener('error', handleStreamFailure);
        };
      }, [activeSource, activeServerIndex, currentChannelSources, useProxy, viewState]);

      const destroyHls = () => {
        if (hlsRef.current) {
          hlsRef.current.destroy();
          hlsRef.current = null;
        }
      };

      const togglePlayPause = () => {
        const video = videoRef.current;
        if (!video) return;
        if (isPlaying) {
          video.pause();
          setIsPlaying(false);
        } else {
          video.play().catch(e => console.log(e));
          setIsPlaying(true);
        }
      };

      const triggerFullscreen = async () => {
        const container = playerContainerRef.current;
        if (!container) return;

        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
          try {
            if (container.requestFullscreen) {
              await container.requestFullscreen();
            } else if (container.webkitRequestFullscreen) {
              await container.webkitRequestFullscreen();
            } else if (container.msRequestFullscreen) {
              await container.msRequestFullscreen();
            }
            
            if (window.screen && window.screen.orientation && window.screen.orientation.lock) {
              window.screen.orientation.lock('landscape').catch(e => console.warn("Orientation lock failed:", e));
            } else if (window.screen && window.screen.lockOrientation) {
              window.screen.lockOrientation('landscape');
            }
          } catch (err) {
            console.warn("Fullscreen error:", err);
         }
        } else {
          try {
            if (document.exitFullscreen) {
              await document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
              await document.webkitExitFullscreen();
            } else if (document.msExitFullscreen) {
              await document.msExitFullscreen();
            }
            
            if (window.screen && window.screen.orientation && window.screen.orientation.unlock) {
              window.screen.orientation.unlock();
            } else if (window.screen && window.screen.unlockOrientation) {
              window.screen.unlockOrientation();
            }
          } catch (err) {
            console.warn("Exit fullscreen error:", err);
         }
        }
      };

      const copyToClipboard = (text) => {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        document.body.appendChild(textArea);
        textArea.select();
        try {
          document.execCommand('copy');
          setIsCopied(true);
          triggerToast("Copied link to clipboard!");
          setTimeout(() => {
            setIsCopied(false);
          }, 2500);
        } catch (err) {
          console.error("Copy failed", err);
        }
        document.body.removeChild(textArea);
      };

      const loadIPTVCategory = (catId, catName) => {
        setActiveCategory("category");
        setSelectedCountryCode("");
        setCuratedSelected(false);
        setSearchQuery(""); 
        setSelectedCategoryFilter(catName); 

        const filtered = globalChannels.filter(ch => ch.category.toLowerCase() === catName.toLowerCase());
        if (filtered.length > 0) {
          setChannels(filtered);
          triggerToast(`Loaded ${filtered.length} channels from ${catName}`);
        } else {
          triggerToast("Syncing category feeds... please wait a moment.");
        }
        setViewState("home");
      };

      const loadIPTVCountry = (countryCode, countryName) => {
        setActiveCategory("country");
        setSelectedCountryCode(countryCode);
        setCuratedSelected(false);
        setSearchQuery(""); 
        setSelectedCategoryFilter("All"); 

        const filtered = globalChannels.filter(ch => ch.countryCode === countryCode.toUpperCase());
        if (filtered.length > 0) {
          setChannels(filtered);
          triggerToast(`Loaded ${filtered.length} channels from ${countryName}`);
        } else {
          triggerToast("Syncing country feeds... please wait a moment.");
        }
        setViewState("home");
      };

      const loadCurated = () => {
        setActiveCategory("curated");
        setSelectedCountryCode("");
        setCuratedSelected(true);
        setChannels(curatedChannels);
        setVideoError(null);
        setSearchQuery(""); 
        setSelectedCategoryFilter("All"); 
        triggerToast("Featured Channel directory restored.");
        setViewState("home");
      };

      useEffect(() => {
        setVisibleLimit(48);
      }, [searchQuery, selectedCategoryFilter, activeCategory, selectedCountryCode, showFavoritesOnly]);

      const uniqueCategories = useMemo(() => {
        const list = new Set();
        channels.forEach(ch => {
          if (ch.category) list.add(ch.category);
        });
        return ["All", ...Array.from(list).sort()];
      }, [channels]);

      const filteredChannels = useMemo(() => {
        let searchPool = channels;
        if (searchQuery.trim() !== "") {
           searchPool = globalChannels.length > 0 ? globalChannels : channels;
        }

        let result = searchPool;

        if (searchQuery.trim() !== "") {
          const query = searchQuery.toLowerCase();
          result = searchPool.filter(ch => {
            return ch.name.toLowerCase().includes(query) || 
                   (ch.category && ch.category.toLowerCase().includes(query)) ||
                   (ch.country && ch.country.toLowerCase().includes(query));
          });

          result.sort((a, b) => {
            const aIsSport = a.category && a.category.toLowerCase().includes("sport");
            const bIsSport = b.category && b.category.toLowerCase().includes("sport");
            if (aIsSport && !bIsSport) return -1;
            if (!aIsSport && bIsSport) return 1;

            const aStartsWith = a.name.toLowerCase().startsWith(query);
            const bStartsWith = b.name.toLowerCase().startsWith(query);
            if (aStartsWith && !bStartsWith) return -1;
            if (!aStartsWith && bStartsWith) return 1;

            return a.name.localeCompare(b.name);
          });
        } else {
          result = searchPool.filter(ch => {
            const matchesCat = selectedCategoryFilter === "All" || ch.category === selectedCategoryFilter;
            const matchesFav = !showFavoritesOnly || favorites.includes(ch.id);
            return matchesCat && matchesFav;
          });
        }
        
        return result;
      }, [channels, globalChannels, searchQuery, selectedCategoryFilter, favorites, showFavoritesOnly]);

      const filteredSeeAllChannels = useMemo(() => {
        if (!seeAllData) return [];
        if (!seeAllSearchQuery.trim()) return seeAllData.channels;
        const query = seeAllSearchQuery.toLowerCase();
        return seeAllData.channels.filter(ch => 
          ch.name.toLowerCase().includes(query) || 
          (ch.category && ch.category.toLowerCase().includes(query))
        );
      }, [seeAllData, seeAllSearchQuery]);

      const handleScroll = (e) => {
        const { scrollTop, scrollHeight, clientHeight } = e.target;
        if (scrollHeight - scrollTop <= clientHeight + 300) {
            if (visibleLimit < filteredChannels.length) {
                setVisibleLimit(prev => prev + 48);
            }
        }
      };

      const channelsToRender = filteredChannels.slice(0, visibleLimit);

      return (
        <div className="flex-grow flex flex-col relative h-screen">
          
          {/* Toast Notification System */}
          {toastMessage && (
            <div className="fixed top-20 left-1/2 -translate-x-1/2 z-[150] bg-slate-800 text-white px-4 py-2 rounded-full shadow-2xl border border-slate-700 animate-fadeIn text-xs font-semibold flex items-center gap-2 pointer-events-none">
              <i data-lucide="info" className="w-4 h-4 text-brand-400"></i>
              {toastMessage}
            </div>
          )}

          {/* Header Controls */}
          <header className="bg-slate-900 border-b border-slate-800 sticky top-0 z-50 px-4 py-3.5 shadow-sm shrink-0">
            <div className="max-w-[1700px] mx-auto flex items-center justify-between gap-4">
              
              {/* Brand Logo */}
              <div className="flex items-center gap-3 cursor-pointer" onClick={loadCurated}>
                <div className="h-10 w-10 rounded-xl bg-gradient-to-br from-brand-500 to-indigo-600 flex items-center justify-center text-white shadow-lg shadow-brand-500/20">
                  <i data-lucide="tv" className="w-6 h-6"></i>
                </div>
                <div>
                  <h1 className="text-xl font-extrabold tracking-tight bg-gradient-to-r from-white via-slate-200 to-brand-400 bg-clip-text text-transparent flex items-center gap-2">
                    GlobalStream <span className="text-[10px] uppercase font-bold tracking-widest bg-brand-600/30 text-brand-400 px-2 py-0.5 rounded border border-brand-500/20">IPTV</span>
                  </h1>
                </div>
              </div>

              {/* Header Hamburger Dropdown Menu for Desktop - Hidden on Mobile */}
              <div className="relative menu-container hidden md:block">
                <button
                  onClick={() => {
                    setIsMenuOpen(!isMenuOpen);
                  }}
                  className="h-10 w-10 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center transition-all focus:outline-none border border-slate-750"
                  aria-label="Toggle Menu"
                >
                  <i data-lucide={isMenuOpen ? "x" : "menu"} className="w-5 h-5"></i>
                </button>

                {isMenuOpen && (
                  <div className="absolute right-0 mt-2 w-64 bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl z-50 p-3 flex flex-col gap-2.5 animate-fadeIn">
                    <button 
                      onClick={() => {
                        loadCurated();
                        setIsMenuOpen(false);
                      }}
                      className={`w-full px-4 py-2.5 rounded-lg text-xs font-semibold flex items-center gap-2 transition-all ${
                        activeCategory === 'curated' && viewState === 'home'
                          ? 'bg-brand-600 text-white shadow-lg shadow-brand-600/20' 
                          : 'bg-slate-850 hover:bg-slate-800 text-slate-300'
                      }`}
                    >
                      <i data-lucide="sparkles" className="w-3.5 h-3.5"></i>
                      Featured
                    </button>

                    {/* Categories Dropdown */}
                    <div className="relative dropdown-container w-full">
                      <button 
                        onClick={() => {
                          setIsCategoryOpen(!isCategoryOpen);
                          setIsCountryOpen(false);
                        }}
                        className="w-full px-4 py-2.5 rounded-lg text-xs font-semibold bg-slate-850 hover:bg-slate-800 text-slate-300 flex items-center justify-between transition-all"
                      >
                        <span className="flex items-center gap-2">
                          <i data-lucide="grid" className="w-3.5 h-3.5"></i>
                          Categories
                        </span>
                        <i data-lucide="chevron-down" className={`w-3.5 h-3.5 transition-transform duration-200 ${isCategoryOpen ? 'rotate-180' : ''}`}></i>
                      </button>
                      {isCategoryOpen && (
                        <>
                          <div className="fixed inset-0 z-[90] bg-black/10 backdrop-blur-[1px]" onClick={() => setIsCategoryOpen(false)}></div>
                          <div className="absolute right-0 mt-2 w-56 bg-slate-900 border border-slate-800 rounded-xl shadow-2xl z-[100] flex flex-col overflow-hidden animate-fadeIn">
                            <div className="px-4 py-2.5 text-[10px] uppercase tracking-wider font-extrabold text-slate-500 bg-slate-900 border-b border-slate-800/65 sticky top-0">
                              Select Category
                            </div>
                            <div className="overflow-y-auto max-h-64 divide-y divide-slate-800/30">
                              {dynamicCategories.map(cat => (
                                <button
                                  key={cat.id}
                                  onClick={() => {
                                    loadIPTVCategory(cat.id, cat.name);
                                    setIsCategoryOpen(false);
                                    setIsMenuOpen(false);
                                  }}
                                  className={`w-full text-left px-4 py-2.5 text-xs hover:bg-slate-800 active:bg-slate-800 flex items-center gap-3 transition-all ${
                                    activeCategory === cat.id ? 'text-brand-400 bg-brand-950/20 font-bold' : 'text-slate-300'
                                  }`}
                                >
                                  <i data-lucide={cat.icon} className="w-4 h-4 text-slate-400"></i>
                                  <span>{cat.name}</span>
                                </button>
                              ))}
                            </div>
                          </div>
                        </>
                      )}
                    </div>

                    {/* Country Explorer Dropdown */}
                    <div className="relative dropdown-container w-full">
                      <button 
                        onClick={() => {
                          setIsCountryOpen(!isCountryOpen);
                          setIsCategoryOpen(false);
                        }}
                        className="w-full px-4 py-2.5 rounded-lg text-xs font-semibold bg-brand-600 hover:bg-brand-500 text-white flex items-center justify-between transition-all shadow-lg shadow-brand-600/25"
                      >
                        <span className="flex items-center gap-2">
                          <i data-lucide="globe" className="w-3.5 h-3.5"></i>
                          Browse Country
                        </span>
                        <i data-lucide="chevron-down" className={`w-3.5 h-3.5 transition-transform duration-200 ${isCountryOpen ? 'rotate-180' : ''}`}></i>
                      </button>
                      {isCountryOpen && (
                        <>
                          <div className="fixed inset-0 z-[90] bg-black/10 backdrop-blur-[1px]" onClick={() => setIsCountryOpen(false)}></div>
                          <div className="absolute right-0 mt-2 w-56 bg-slate-900 border border-slate-800 rounded-xl shadow-2xl z-[100] flex flex-col overflow-hidden animate-fadeIn">
                            <div className="px-4 py-2.5 text-[10px] uppercase tracking-wider font-extrabold text-slate-500 bg-slate-900 border-b border-slate-800/65 sticky top-0">
                              Select Country TV
                            </div>
                            <div className="overflow-y-auto max-h-64 divide-y divide-slate-800/30">
                              {dynamicCountries.map(ct => (
                                <button
                                  key={ct.code}
                                  onClick={() => {
                                    loadIPTVCountry(ct.code, ct.name);
                                    setIsCountryOpen(false);
                                    setIsMenuOpen(false);
                                  }}
                                  className={`w-full text-left px-4 py-2.5 text-xs hover:bg-slate-800 active:bg-slate-800 flex items-center justify-between transition-all ${
                                    selectedCountryCode === ct.code ? 'text-brand-400 bg-brand-950/25 font-bold' : 'text-slate-300'
                                  }`}
                                >
                                  <span className="truncate pr-2">{ct.name}</span>
                                  <span className="text-[10px] uppercase font-mono text-slate-500 bg-slate-950 px-2 py-0.5 rounded border border-slate-850 shrink-0">
                                    {ct.code}
                                  </span>
                                </button>
                              ))}
                            </div>
                          </div>
                        </>
                      )}
                    </div>

                    <button 
                      onClick={() => {
                        setIsNsPlayerModalOpen(true);
                        setIsMenuOpen(false);
                      }}
                      className="w-full px-4 py-2.5 rounded-lg text-xs font-semibold bg-emerald-600 hover:bg-emerald-500 text-white flex items-center gap-2 transition-all shadow-lg shadow-emerald-600/25 justify-center"
                    >
                      <i data-lucide="play-square" className="w-3.5 h-3.5"></i>
                      NS Player Servers
                    </button>
                  </div>
                )}
              </div>

            </div>
          </header>

          {/* MAIN CONTENT AREA - SCROLLABLE CONTAINER */}
          <main className="flex-grow overflow-y-auto w-full bg-slate-950" onScroll={handleScroll}>
            
            {/* ===================================================================== */}
            {/* VIEW 1: HOME (CHANNEL GRID & CAROUSELS)                               */}
            {/* ===================================================================== */}
            {viewState === "home" && (
              <div className="max-w-[1700px] mx-auto px-4 py-6 flex flex-col gap-6 animate-fadeIn pb-24 md:pb-6">
                
                {/* --- DESKTOP VIEW LAYOUT --- */}
                <div className="hidden md:flex flex-col gap-6">
                  {/* Search & Filters Bar */}
                  <div className="bg-slate-900 p-4 rounded-2xl border border-slate-800/80 shadow-md flex flex-col lg:flex-row gap-4 items-center justify-between">
                    <div className="flex flex-col sm:flex-row items-center gap-4 w-full lg:w-auto flex-grow max-w-2xl">
                      <div className="relative w-full">
                        <input 
                          type="text" 
                          placeholder={isLoadingGlobal ? "Updating live index database..." : `Search ${globalChannels.length.toLocaleString() || "..."} global channels...`}
                          value={searchQuery}
                          onChange={(e) => setSearchQuery(e.target.value)}
                          className="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-4 py-3 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500/50 transition-all"
                        />
                        <i data-lucide="search" className="w-4 h-4 text-slate-500 absolute left-4 top-1/2 -translate-y-1/2"></i>
                      </div>

                    </div>

                    <div className="flex items-center justify-between w-full lg:w-auto gap-4 shrink-0">
                      <div className="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-slate-950 border border-slate-800 text-[11px] font-bold text-slate-400">
                        <span className={`h-2 w-2 rounded-full ${isLoadingGlobal ? 'bg-amber-500 animate-pulse' : 'bg-emerald-500'}`}></span>
                        <span>
                          {isLoadingGlobal ? "Indexing DB..." : "DB Ready"}
                        </span>
                      </div>

                      <div className="flex items-center gap-4">
                        <div className="flex flex-col items-end hidden sm:flex">
                          <span className="text-xs font-bold text-slate-300">Featured Channels</span>
                          <span className="text-[10px] text-brand-400">{filteredChannels.length} results</span>
                        </div>
                        <button 
                          onClick={() => setShowFavoritesOnly(prev => !prev)}
                          className={`text-sm flex items-center gap-2 px-4 py-2 rounded-xl transition-all ${
                            showFavoritesOnly 
                              ? 'bg-amber-500/20 text-amber-400 font-bold border border-amber-500/30 shadow-lg shadow-amber-500/10' 
                              : 'bg-slate-800 text-slate-300 hover:bg-slate-700 border border-slate-700'
                          }`}
                        >
                          <i data-lucide="star" className={`w-4 h-4 ${showFavoritesOnly ? 'fill-current' : ''}`}></i>
                          Favorites
                        </button>
                      </div>
                    </div>
                  </div>

                  {/* Featured Channel Title */}
                  {searchQuery.trim() === "" && !showFavoritesOnly && selectedCategoryFilter === "All" && activeCategory === "curated" && (
                    <div className="flex items-center gap-2 mt-2 mb-1">
                      <i data-lucide="sparkles" className="w-5 h-5 text-brand-400"></i>
                      <h2 className="text-xl font-bold text-white">Featured</h2>
                    </div>
                  )}

                  {/* Grid List Container */}
                  {channelsToRender.length === 0 ? (
                    <div className="flex flex-col items-center justify-center h-64 text-center p-6 text-slate-500">
                      <i data-lucide="tv-2" className="w-16 h-16 mb-4 opacity-20"></i>
                      <p className="text-lg font-semibold text-slate-400">No channels found</p>
                      <p className="text-sm mt-1">Try adjusting your search or category filter.</p>
                    </div>
                  ) : (
                    <div className="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 xl:grid-cols-7 2xl:grid-cols-8 gap-3 md:gap-4 pb-4 animate-fadeIn">
                      {channelsToRender.map((channel, index) => {
                        const isFavorited = favorites.includes(channel.id);
                        return (
                          <button
                            key={`${channel.id}-${index}`}
                            onClick={() => handleSelectChannel(channel)}
                            className="group flex flex-col p-2 sm:p-2.5 rounded-2xl bg-slate-900 border border-slate-800/80 hover:bg-slate-800 hover:border-brand-500/50 hover:shadow-xl hover:shadow-brand-500/10 transition-all text-left relative overflow-hidden"
