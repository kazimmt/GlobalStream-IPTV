                            title="Volume Control"
                          />
                          <span className="text-[10px] sm:text-xs font-semibold text-slate-300 w-8 text-right tabular-nums shrink-0">{isMuted ? 0 : volumeLevel}%</span>
                        </div>

                        <button 
                          onClick={() => {
                            const urlToCopy = activeSource ? activeSource.url : '';
                            copyToClipboard(urlToCopy);
                          }}
                          className={`h-11 px-4 rounded-xl border flex items-center gap-2 text-sm font-semibold transition-all ${
                            isCopied 
                              ? 'bg-emerald-500/15 border-emerald-500/50 text-emerald-400' 
                              : 'bg-slate-950 border-slate-800 text-slate-300 hover:text-white hover:bg-slate-800'
                          }`}
                          title="Copy raw stream URL to play on VLC Player"
                        >
                          <i data-lucide={isCopied ? "check" : "copy"} className="w-4 h-4"></i>
                          <span className="hidden sm:inline">{isCopied ? "Copied Link" : "Copy Link"}</span>
                        </button>

                        <button 
                          onClick={(e) => activeChannelWithFreshData && toggleFavorite(activeChannelWithFreshData.id, e)}
                          className={`h-11 w-11 rounded-xl border flex items-center justify-center transition-all shrink-0 ${
                            activeChannelWithFreshData && favorites.includes(activeChannelWithFreshData.id)
                              ? 'bg-amber-500/15 border-amber-500/50 text-amber-400'
                              : 'bg-slate-950 border-slate-800 text-slate-300 hover:text-white hover:bg-slate-800'
                          }`}
                          title="Toggle Favorite"
                        >
                          <i data-lucide="star" className={`w-5 h-5 ${activeChannelWithFreshData && favorites.includes(activeChannelWithFreshData.id) ? 'fill-current' : ''}`}></i>
                        </button>
                      </div>
                    </div>

                  </div>
                </div>
              </div>
            )}

            {/* ===================================================================== */}
            {/* VIEW 3: SEE ALL CHANNELS MODAL POPUP                                  */}
            {/* ===================================================================== */}
            {seeAllData && (
              <div className="fixed inset-0 z-[200] flex items-center justify-center bg-black/70 backdrop-blur-sm p-4 animate-fadeIn pb-24 md:pb-4">
                <div className="bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl max-w-6xl w-full h-[85vh] overflow-hidden flex flex-col relative animate-[fadeIn_0.2s_ease-out]">
                  
                  {/* Modal Header */}
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between px-5 py-4 border-b border-slate-800 bg-slate-900/50 shrink-0 gap-3">
                    <div className="flex items-center gap-2">
                      <h3 className="text-lg font-bold text-white">
                        {seeAllData.title}
                      </h3>
                      <span className="text-xs bg-slate-800 text-slate-400 px-2.5 py-0.5 rounded-full font-semibold">
                        {filteredSeeAllChannels.length} / {seeAllData.channels.length}
                      </span>
                    </div>

                    {/* Integrated Search Input inside "See All" Popup */}
                    <div className="flex items-center gap-2 flex-grow max-w-md sm:mx-4">
                      <div className="relative w-full">
                        <input 
                          type="text" 
                          placeholder={`Search within ${seeAllData.title}...`}
                          value={seeAllSearchQuery}
                          onChange={(e) => setSeeAllSearchQuery(e.target.value)}
                          className="w-full bg-slate-950 border border-slate-800 rounded-xl pl-9 pr-4 py-2 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500/50 transition-all"
                        />
                        <i data-lucide="search" className="w-3.5 h-3.5 text-slate-500 absolute left-3 top-1/2 -translate-y-1/2"></i>
                      </div>
                      {seeAllSearchQuery && (
                        <button 
                          onClick={() => setSeeAllSearchQuery("")}
                          className="text-xs font-bold text-slate-400 hover:text-white bg-slate-800 px-2 py-2 rounded-lg transition-colors shrink-0"
                        >
                          Clear
                        </button>
                      )}
                    </div>

                    <button
                      onClick={() => {
                        setSeeAllSearchQuery("");
                        setSeeAllData(null);
                      }}
                      className="text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 p-1.5 rounded-lg transition-colors self-end sm:self-auto"
                    >
                      <i data-lucide="x" className="w-5 h-5"></i>
                    </button>
                  </div>

                  {/* Modal Content - Smaller Card Grid */}
                  <div className="p-5 overflow-y-auto flex-grow bg-slate-950">
                    {filteredSeeAllChannels.length === 0 ? (
                      <div className="flex flex-col items-center justify-center h-full text-center p-6 text-slate-500">
                        <i data-lucide="search" className="w-12 h-12 mb-3 opacity-25"></i>
                        <p className="text-sm font-semibold text-slate-400">No matching channels found</p>
                        <p className="text-xs mt-1">Try typing a different name.</p>
                      </div>
                    ) : (
                      <div className="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 xl:grid-cols-7 2xl:grid-cols-8 gap-3 md:gap-4 pb-4">
                        {filteredSeeAllChannels.map((channel, index) => {
                          const isFavorited = favorites.includes(channel.id);
                          return (
                            <button
                              key={`seeall-${channel.id}-${index}`}
                              onClick={() => {
                                setSeeAllSearchQuery("");
                                setSeeAllData(null);
                                handleSelectChannel(channel);
                              }}
                              className="group flex flex-col p-2 sm:p-2.5 rounded-2xl bg-slate-900 border border-slate-800/80 hover:bg-slate-800 hover:border-brand-500/50 hover:shadow-xl hover:shadow-brand-500/10 transition-all text-left relative overflow-hidden"
                            >
                              <div
                                className="absolute top-2.5 right-2.5 z-20 cursor-pointer p-1 sm:p-1.5 rounded-lg bg-slate-950/80 backdrop-blur-sm border border-slate-800 opacity-0 group-hover:opacity-100 transition-opacity hover:bg-slate-900"
                                onClick={(e) => {
                                  e.stopPropagation();
                                  toggleFavorite(channel.id, e);
                                }}
                              >
                                <i data-lucide="star" className={`w-3.5 h-3.5 ${isFavorited ? 'fill-amber-400 text-amber-400' : 'text-slate-400'}`}></i>
                              </div>

                              <div className="w-full aspect-video bg-slate-700 rounded-xl mb-2.5 flex items-center justify-center p-2 relative overflow-hidden">
                                <div className="w-full h-full relative z-10 drop-shadow-[0_0_8px_rgba(0,0,0.2,0.2)]">
                                  <ChannelLogo name={channel.name} logoUrl={channel.logo} />
                                </div>
                                <div className="absolute inset-0 opacity-20 blur-xl scale-150 pointer-events-none">
                                  <ChannelLogo name={channel.name} logoUrl={channel.logo} />
                                </div>
                              </div>

                              <h4 className="text-[11px] sm:text-xs font-bold text-slate-200 group-hover:text-white truncate w-full px-1">
                                {channel.name}
                              </h4>
                              
                              <div className="flex items-center gap-1.5 mt-1.5 px-1 text-[9px] sm:text-[10px] uppercase font-bold tracking-wider text-slate-500">
                                 <span className="truncate max-w-[100px] bg-slate-950 border border-slate-800 px-1.5 py-0.5 rounded text-brand-400/80">
                                   {channel.category}
                                 </span>
                              </div>
                            </button>
                          );
                        })}
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* ===================================================================== */}
            {/* VIEW 4: NS PLAYER SERVERS MODAL                                       */}
            {/* ===================================================================== */}
            {isNsPlayerModalOpen && (
              <div className="fixed inset-0 z-[200] flex items-center justify-center bg-black/70 backdrop-blur-sm p-4 animate-fadeIn pb-24 md:pb-4">
                <div className="bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl max-w-xl w-full overflow-hidden flex flex-col relative animate-[fadeIn_0.2s_ease-out]">
                  
                  {/* Modal Header */}
                  <div className="flex items-center justify-between px-5 py-4 border-b border-slate-800 bg-slate-900/50">
                    <h3 className="text-lg font-bold text-white flex items-center gap-2">
                      <i data-lucide="monitor-play" className="text-brand-400"></i>
                      NS Player Instructions
                    </h3>
                    <button
                      onClick={() => setIsNsPlayerModalOpen(false)}
                      className="text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 p-1.5 rounded-lg transition-colors"
                    >
                      <i data-lucide="x" className="w-5 h-5"></i>
                    </button>
                  </div>
                  
                  {/* Modal Content */}
                  <div className="p-5 flex flex-col gap-5 overflow-y-auto max-h-[75vh]">
                    
                    <div className="bg-emerald-950/20 border border-emerald-500/20 rounded-xl p-4 text-sm text-slate-300">
                      <h4 className="font-bold text-emerald-400 mb-2 flex items-center gap-2">
                        <i data-lucide="info" className="w-4 h-4"></i>
                        How to use with NS Player:
                      </h4>
                      <ol className="list-decimal list-inside space-y-1.5 marker:text-emerald-500/70 ml-1">
                        <li>Download and install <strong>NS Player</strong> from the Google Play Store.</li>
                        <li>Open the app and look for the option to <strong>Playlist</strong>.</li>
                        <li>Copy one of the live server links provided below.</li>
                        <li>Paste the copied URL into NS Player and hit save. Enjoy the stream!</li>
                      </ol>
                    </div>

                    <div className="flex flex-col gap-3 mt-1">
                      <h4 className="text-xs uppercase tracking-wider font-extrabold text-slate-500 mb-1 border-b border-slate-800/50 pb-2">
                        Copiable Server URLs
                      </h4>
                      
                      {[
                        { id: 'Fifa+', name: 'FIFA+', url: 'https://cutt.ly/fifaplus' },
                        { id: 'tapmad', name: 'Tapmad BD Live', url: 'https://cutt.ly/tapmadbd' },
						{ id: 'sonyliv', name: 'SonyLiV Live', url: 'https://cutt.ly/SonyLiV' },
                        { id: 'toffee', name: 'Toffee', url: 'https://raw.githubusercontent.com/BINOD-XD/Toffee-Auto-Update-Playlist/refs/heads/main/toffee_NS_Player.m3u' },
						{ id: 'akashgo', name: 'Akash Go', url: 'https://raw.githubusercontent.com/srhady/Hady/refs/heads/main/akash_live.m3u' },
						{ id: 'aynaott', name: 'Ayna OTT', url: 'https://raw.githubusercontent.com/srhady/AynaOTT/refs/heads/main/aynaott.m3u' },
						{ id: 'axsports', name: 'AX Sports Live', url: 'https://raw.githubusercontent.com/srhady/axsports/refs/heads/main/playlist.m3u' },
						{ id: 'bingstream', name: 'Bing Stream', url: 'https://raw.githubusercontent.com/srhady/bingstream/refs/heads/main/playlist.m3u' }
                      ].map(link => (
                        <div key={link.id} className="bg-slate-950 border border-slate-800 rounded-xl p-3 flex flex-col gap-2 transition-colors hover:border-slate-700">
                          <span className="text-xs font-bold text-slate-300">{link.name}</span>
                          <div className="flex gap-2">
                            <input
                              type="text"
                              readOnly
                              value={link.url}
                              className="bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-400 w-full focus:outline-none focus:border-brand-500/50"
                            />
                            <button
                              onClick={() => {
                                copyToClipboard(link.url);
                                setCopiedLinkId(link.id);
                                setTimeout(() => setCopiedLinkId(null), 2500);
                              }}
                              className={`px-3 py-2 rounded-lg flex items-center justify-center transition-all shrink-0 border ${
                                copiedLinkId === link.id 
                                  ? 'bg-emerald-500/15 border-emerald-500/50 text-emerald-400' 
                                  : 'bg-slate-800 hover:bg-slate-700 border-slate-700 text-slate-300'
                              }`}
                              title="Copy URL"
                            >
                              <i data-lucide={copiedLinkId === link.id ? "check" : "copy"} className="w-4 h-4"></i>
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>

                  </div>
                </div>
              </div>
            )}
            
          </main>

          {/* ===================================================================== */}
          {/* BOTTOM TAB BAR NAVIGATION FOR MOBILE                                  */}
          {/* ===================================================================== */}
          {}
          <div className="fixed bottom-0 left-0 right-0 z-40 bg-slate-900/95 backdrop-blur-md border-t border-slate-800/80 flex justify-around py-3 md:hidden">
            <button 
              onClick={() => { setActiveMobileTab("home"); setViewState("home"); }} 
              className={`flex flex-col items-center gap-1.5 text-[10px] font-bold transition-all focus:outline-none ${activeMobileTab === "home" && viewState !== "player" ? "text-brand-400" : "text-slate-400"}`}
            >
              <i data-lucide="home" className="w-5 h-5"></i>
              <span>Home</span>
            </button>
            
            <button 
              onClick={() => { setActiveMobileTab("search"); setViewState("home"); }} 
              className={`flex flex-col items-center gap-1.5 text-[10px] font-bold transition-all focus:outline-none ${activeMobileTab === "search" && viewState !== "player" ? "text-brand-400" : "text-slate-400"}`}
            >
              <i data-lucide="search" className="w-5 h-5"></i>
              <span>Search</span>
            </button>
            
            <button 
              onClick={() => { setActiveMobileTab("favorites"); setViewState("home"); }} 
              className={`flex flex-col items-center gap-1.5 text-[10px] font-bold transition-all focus:outline-none ${activeMobileTab === "favorites" && viewState !== "player" ? "text-brand-400" : "text-slate-400"}`}
            >
              <i data-lucide="star" className={`w-5 h-5 ${activeMobileTab === "favorites" && viewState !== "player" ? "fill-brand-400/10" : ""}`}></i>
              <span>Favorites</span>
            </button>
            
            <button 
              onClick={() => { setActiveMobileTab("settings"); setViewState("home"); }} 
              className={`flex flex-col items-center gap-1.5 text-[10px] font-bold transition-all focus:outline-none ${activeMobileTab === "settings" && viewState !== "player" ? "text-brand-400" : "text-slate-400"}`}
            >
              <i data-lucide="settings" className="w-5 h-5"></i>
              <span>Settings</span>
            </button>
          </div>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
  
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(registration => {
            console.log('ServiceWorker registration successful with scope: ', registration.scope);
          }, err => {
            console.log('ServiceWorker registration failed: ', err);
          });
      });
    }
  </script>
</body>
</html>
